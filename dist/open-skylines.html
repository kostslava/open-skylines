  S.removeBuilding = function (b, quiet) {
    const Wd = CB.World;
    if (!S.buildings.has(b.id)) return;
    for (const t of lotTiles(b)) if (Wd.bld[t] === b.id) Wd.bld[t] = 0;
    if (S.isRes(b)) releaseWork(b);
    if (S.isWork(b)) {
      S.buildings.forEach(o => { if (o.work.length) o.work = o.work.filter(w => w.id !== b.id); });
    }
    S.buildings.delete(b.id);
    CB.Meshes.removeBuilding(b);
    CB.Meshes.treesDirty = true;
    S.zoneTexDirty = true; S.lotsDirty = true;
    if (b.kind === 'svc') S.covDirty = true;
    if (CB.UI && CB.UI.selected === b) CB.UI.select(null);
  };
  function releaseWork(b) {
    for (const w of b.work) { const o = S.buildings.get(w.id); if (o) o.filled = Math.max(0, o.filled - w.n); }
    b.work = [];
  }
  function employedOf(b) { let n = 0; for (const w of b.work) n += w.n; return n; }
  S.employedOf = employedOf;

  // ------------------------------------------------------------------
  // Lots & growth
  // ------------------------------------------------------------------
  function frontOK(i, d) {
    const Wd = CB.World;
    const j = Wd.neighbor(i, d);
    return j >= 0 && Wd.road[j] && C.ROADS[Wd.road[j]].zonable ? j : -1;
  }
  function tileFree(t, z) {
    const Wd = CB.World;
    return Wd.zone[t] === z && !Wd.bld[t] && !Wd.road[t] && !Wd.pmask[t] && Wd.rail[t] !== 1 && Wd.buildable(t);
  }
  function rebuildLots() {
    const Wd = CB.World;
    S.lots = [[], [], [], [], [], [], [], []];
    for (let i = 0; i < N; i++) {
      const z = Wd.zone[i];
      if (!z || !tileFree(i, z)) continue;
      for (let d = 0; d < 4; d++) { const j = frontOK(i, d); if (j >= 0 && Wd.conn[j]) { S.lots[z].push(i); break; } }
    }
    S.lotsDirty = false;
  }
  function fitLot(i, f, w, d, z) {
    const g = (f + 2) % 4, a = (f + 1) % 4;
    const x = U.tx(i), y = U.ty(i);
    const offs = []; for (let o = 0; o < w; o++) offs.push(o);
    if (S.rng() < 0.5) offs.reverse();
    for (const off of offs) {
      let ok = true, minx = 1e9, miny = 1e9, maxx = -1, maxy = -1, road = -1;
      for (let k = 0; k < w && ok; k++) for (let j = 0; j < d; j++) {
        const tx = x + C.DX[a] * (k - off) + C.DX[g] * j, ty = y + C.DY[a] * (k - off) + C.DY[g] * j;
        if (!U.inPlay(tx, ty)) { ok = false; break; }
        const t = U.idx(tx, ty);
        if (!tileFree(t, z)) { ok = false; break; }
        if (j === 0) { const r = frontOK(t, f); if (r < 0) { ok = false; break; } if (road < 0) road = r; }
        minx = Math.min(minx, tx); maxx = Math.max(maxx, tx); miny = Math.min(miny, ty); maxy = Math.max(maxy, ty);
      }
      if (ok) return { x: minx, y: miny, fw: maxx - minx + 1, fh: maxy - miny + 1, w, d, dir: f, road };
    }
    return null;
  }
  function tryGrow(z) {
    const Wd = CB.World;
    const L = S.lots[z]; if (!L.length) return false;
    for (let attempt = 0; attempt < 6; attempt++) {
      const k = Math.floor(S.rng() * L.length), i = L[k];
      if (!tileFree(i, z)) { L[k] = L[L.length - 1]; L.pop(); if (!L.length) return false; continue; }
      const dirs = [];
      for (let d = 0; d < 4; d++) { const j = frontOK(i, d); if (j >= 0 && Wd.conn[j]) dirs.push(d); }
      if (!dirs.length) continue;
      const f = U.pick(dirs, S.rng);
      // fill the zone as deep as it goes from this frontage, then pick a width
      const Z = C.ZONES[z], g = (f + 2) % 4;
      let maxD = 0;
      for (let j = 0; j < 3; j++) { const tx = U.tx(i) + C.DX[g] * j, ty = U.ty(i) + C.DY[g] * j; if (!U.inPlay(tx, ty) || !tileFree(U.idx(tx, ty), z)) break; maxD++; }
      let depths = [...new Set(Z.lots.map(l => l[1]))].filter(dd => dd <= maxD).sort((p, q) => q - p);
      if (!depths.length) continue;
      const sizes = [];
      for (const dd of depths) {
        const opts = Z.lots.filter(l => l[1] === dd).map(l => [l[0], l[1], (z === 1 && l[0] === 1 ? 2.2 : 1) * (l[2] || 1) * (z === 1 ? 1 : l[0])]);
        // weighted shuffle within one depth
        opts.forEach(o => { o[2] = Math.pow(S.rng(), 1 / o[2]); });
        opts.sort((p, q) => q[2] - p[2]);
        sizes.push(...opts);
      }
      for (const [w, d] of sizes) {
        const spec = fitLot(i, f, w, d, z);
        if (spec) {
          const b = makeBuilding(Object.assign(spec, { kind: 'zone', zone: z, state: 'build', buildT: 1 + w * d * 0.25 }));
          b.cap = S.capOf(b);
          if (!S.isRes(b)) b.jobs = b.cap;
          return true;
        }
      }
    }
    return false;
  }

  S.setZone = function (i, z) {
    const Wd = CB.World;
    if (Wd.zone[i] === z) return false;
    if (z && !Wd.zonable[i]) return false;
    const bid = Wd.bld[i];
    if (bid) {
      const b = S.buildings.get(bid);
      if (b && b.kind === 'svc') return false;
      if (b && b.zone !== z) S.removeBuilding(b);
    }
    Wd.zone[i] = z;
    S.lotsDirty = true; S.zoneTexDirty = true;
    return true;
  };

  // ------------------------------------------------------------------
  // Services
  // ------------------------------------------------------------------
  S.serviceLot = function (key, cx, cy, dir) {
    const sv = C.SERVICES[key], Wd = CB.World;
    const [w, d] = sv.size;
    const tryDir = f => {
      const fw = f % 2 === 0 ? w : d, fh = f % 2 === 0 ? d : w;
      const x = cx - Math.floor((fw - 1) / 2), y = cy - Math.floor((fh - 1) / 2);
      let ok = true, road = -1, reason = '';
      for (let yy = y; yy < y + fh; yy++) for (let xx = x; xx < x + fw; xx++) {
        if (!U.inPlay(xx, yy)) { ok = false; reason = 'Outside the city limits'; continue; }
        const t = U.idx(xx, yy);
        if (!Wd.buildable(t)) { ok = false; reason = 'Ground is too steep or wet'; }
        else if (Wd.road[t]) { ok = false; reason = 'Blocked by a road'; }
        else if (Wd.pmask[t]) { ok = false; reason = 'Blocked by a path'; }
        else if (Wd.rail[t] === 1) { ok = false; reason = 'Blocked by elevated track'; }
        else if (Wd.bld[t]) { const b = S.buildings.get(Wd.bld[t]); if (!b || b.kind === 'svc') { ok = false; reason = 'Blocked by a building'; } }
      }
      // front edge must touch a road
      const g = (f + 2) % 4;
      for (let yy = y; yy < y + fh; yy++) for (let xx = x; xx < x + fw; xx++) {
        const t = U.idx(xx, yy);
        const n = Wd.neighbor(t, f);
        if (n < 0) continue;
        const nx = U.tx(n), ny = U.ty(n);
        const inside = nx >= x && nx < x + fw && ny >= y && ny < y + fh;
        if (!inside && Wd.road[n] && road < 0) road = n;
      }
      if (road < 0 && ok) { ok = false; reason = 'Needs a road along the front'; }
      return { x, y, fw, fh, w, d, dir: f, road, ok, reason, g };
    };
    let first = tryDir(dir);
    if (first.ok || dir === undefined) return first;
    for (let k = 1; k < 4; k++) { const r = tryDir((dir + k) % 4); if (r.ok) return r; }
    // snap: look for a valid spot facing a road within 2 tiles of the cursor
    const offs = [];
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (dx || dy) offs.push([dx, dy]);
    offs.sort((a, b) => Math.abs(a[0]) + Math.abs(a[1]) - Math.abs(b[0]) - Math.abs(b[1]));
    const ocx = cx, ocy = cy;
    for (const [dx, dy] of offs) {
      cx = ocx + dx; cy = ocy + dy;
      for (let k = 0; k < 4; k++) { const r = tryDir((dir + k) % 4); if (r.ok) return r; }
    }
    return first;
  };
  S.placeService = function (key, lot) {
    const Wd = CB.World;
    // clear zoned buildings in the way
    for (let yy = lot.y; yy < lot.y + lot.fh; yy++) for (let xx = lot.x; xx < lot.x + lot.fw; xx++) {
      const t = U.idx(xx, yy);
      if (Wd.bld[t]) { const b = S.buildings.get(Wd.bld[t]); if (b) S.removeBuilding(b); }
      Wd.zone[t] = 0;
    }
    const b = makeBuilding({ kind: 'svc', svc: key, x: lot.x, y: lot.y, fw: lot.fw, fh: lot.fh, w: lot.w, d: lot.d, dir: lot.dir, road: lot.road, state: 'live' });
    S.covDirty = true;
    return b;
  };

  // ------------------------------------------------------------------
  // Network edits
  // ------------------------------------------------------------------
  S.setRoad = function (i, type) {
    const Wd = CB.World;
    Wd.road[i] = type; Wd.tree[i] = 0;
    if (type) Wd.zone[i] = 0;
    CB.Meshes.markInfra(i);
    CB.Meshes.treesDirty = true;
  };
  S.setRail = function (i, type) {
    const Wd = CB.World;
    Wd.rail[i] = type;
    if (type === 1) { Wd.tree[i] = 0; if (!Wd.road[i]) Wd.zone[i] = 0; }
    CB.Meshes.markInfra(i);
    CB.Meshes.treesDirty = true;
  };
  S.networkChanged = function () {
    const Wd = CB.World;
    Wd.updateZonable();
    Wd.updateConn();
    Wd.updateJunctions();
    Wd.roadVer++;
    CB.Meshes.junctionsChanged();
    for (let i = 0; i < N; i++) if (Wd.zone[i] && !Wd.zonable[i] && !Wd.bld[i]) Wd.zone[i] = 0;
    S.lotsDirty = true; S.zoneTexDirty = true;
    CB.Traffic.validate();
    CB.Transit.validate();
    // re-home buildings whose road vanished
    S.buildings.forEach(b => { if (!Wd.road[b.road]) rehome(b); });
  };
  function rehome(b) {
    const Wd = CB.World;
    for (const t of lotTiles(b)) for (let d = 0; d < 4; d++) {
      const n = Wd.neighbor(t, d);
      if (n >= 0 && Wd.road[n] && Wd.bld[n] !== b.id) { b.road = n; return true; }
    }
    return false;
  }

  // ------------------------------------------------------------------
  // Coverage & land value
  // ------------------------------------------------------------------
  function stamp(arr, cx, cy, r, s, add) {
    const r2 = r * r;
    for (let y = Math.max(0, Math.floor(cy - r)); y <= Math.min(W - 1, Math.ceil(cy + r)); y++) {
      for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(W - 1, Math.ceil(cx + r)); x++) {
        const d2 = (x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2;
        if (d2 > r2) continue;
        const f = s * (1 - d2 / r2 * 0.75);
        const i = y * W + x;
        arr[i] = add ? Math.min(1.5, arr[i] + f) : Math.max(arr[i], f);
      }
    }
  }
  function falloff(arr, cx, cy, r0, s) {
    const R = r0 * 4, r02 = r0 * r0;
    for (let y = Math.max(0, Math.floor(cy - R)); y <= Math.min(W - 1, Math.ceil(cy + R)); y++) {
      for (let x = Math.max(0, Math.floor(cx - R)); x <= Math.min(W - 1, Math.ceil(cx + R)); x++) {
        const d2 = (x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2;
        const f = s / (1 + d2 / r02) - 0.06;
        if (f <= 0) continue;
        const i = y * W + x;
        arr[i] = Math.min(1.5, arr[i] + f);
      }
    }
  }
  function computeCoverage() {
    const Wd = CB.World, cv = S.cov;
    for (const k of COV_KEYS) cv[k].fill(0);
    S.buildings.forEach(b => {
      const cx = b.x + b.fw / 2, cy = b.y + b.fh / 2;
      if (b.kind === 'svc') {
        const sv = C.SERVICES[b.svc];
        if (!Wd.road[b.road]) return;
        // no hard edge: strength fades with distance, and several buildings add up
        falloff(cv[sv.cov], cx, cy, sv.radius * 0.55, sv.cov === 'park' || sv.cov === 'landmark' ? 1 : 1.1);
        if (sv.pollute) stamp(cv.pollution, cx, cy, 6, sv.pollute, true);
      } else if (b.zone === 6 && b.state === 'live') {
        stamp(cv.pollution, cx, cy, 6 + b.level, 0.32 + b.level * 0.05, true);
      }
    });
    for (const s of CB.Transit.stops) {
      if (!CB.Transit.lines.some(l => l.stops.includes(s.id))) continue;
      stamp(cv.transit, U.tx(s.tile) + 0.5, U.ty(s.tile) + 0.5, C.WALK_R + (s.type === 'rail' ? 3 : 0), s.type === 'rail' ? 1 : 0.7, false);
    }
    // noise from traffic
    const L = CB.Traffic.load;
    for (let i = 0; i < N; i++) {
      const rt = Wd.road[i]; if (!rt) continue;
      const R = C.ROADS[rt]; if (!R.car) continue;
      const hw = R.grp === 'highway';
      const v = Math.min(1, L[i] / R.cap) * (hw ? 1 : 0.7) + (hw ? 0.35 : R.grp === 'large' ? 0.12 : 0);
      if (v < 0.08) continue;
      const x = U.tx(i), y = U.ty(i);
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const nx = x + dx, ny = y + dy; if (!U.inWorld(nx, ny)) continue;
        const j = ny * W + nx, f = v * (1 - (Math.abs(dx) + Math.abs(dy)) * 0.2);
        if (f > cv.noise[j]) cv.noise[j] = f;
      }
    }
    // tree-lined streets
    for (let i = 0; i < N; i++) {
      const rt = Wd.road[i]; if (!rt || !C.ROADS[rt].trees) continue;
      stamp(cv.park, U.tx(i) + 0.5, U.ty(i) + 0.5, 3, 0.25, true);
    }
    // land value
    for (let y = C.P0; y < C.P1; y++) for (let x = C.P0; x < C.P1; x++) {
      const i = y * W + x;
      let v = 8 + 16 * cv.health[i] + 12 * cv.police[i] + 14 * cv.edu[i] + 20 * Math.min(1, cv.park[i]) + 24 * Math.min(1, cv.landmark[i])
        + 6 * cv.fire[i] + 12 * waterNear[i] + 10 * cv.transit[i] - 40 * Math.min(1, cv.pollution[i]) - 10 * cv.noise[i];
      cv.lv[i] = U.clamp(v, 0, 100);
    }
    S.covDirty = false;
  }
  S.computeCoverage = computeCoverage;

  // ------------------------------------------------------------------
  // Hourly building update
  // ------------------------------------------------------------------
  function hourlyBuildings() {
    const Wd = CB.World, cv = S.cov;
    let pop = 0, happySum = 0, happyW = 0, workers = 0, employed = 0, jobs = 0, filled = 0, eduSum = 0, outsideIn = 0, comm = 0, commN = 0;
    const icons = [];
    const toRemove = [];
    const resDemand = Math.max(S.demand.rlow, S.demand.rmed, S.demand.rhigh);
    S.buildings.forEach(b => {
      b.age++;
      const i = S.centerTile(b);
      const noRoad = !Wd.road[b.road] && !rehome(b);
      const noConn = noRoad || !Wd.conn[b.road];
      b.prob = null;
      if (b.kind === 'svc') {
        if (noRoad) b.prob = 'noroad';
        if (b.prob) icons.push(iconFor(b));
        return;
      }
      if (b.state === 'build') return;
      const z = C.ZONES[b.zone];
      const res = z.cat === 'res';
      // fires
      if (b.state === 'fire') {
        b.fire += 1;
        if (b.fire > 7) { toRemove.push(b); S.notify(b.name + ' burned down. Build a Fire Station nearby.', 'bad'); return; }
        icons.push(iconFor(b, 'fire'));
        return;
      }
      if (b.state === 'live' && S.rng() < (0.00002 + 0.00014 * Math.max(0, 1 - cv.fire[i] * 1.5)) * Math.min(1, b.age / 96)) startFire(b);
      // garbage
      const occ = res ? b.res : b.filled + b.outside;
      if (b.state === 'live') b.garbage += (occ * (res ? 0.07 : 0.09) + 0.5) / (0.85 + b.level * 0.15);
      // happiness
      let h;
      const tax = S.tax[z.cat];
      if (res) {
        const wk = Math.round(b.res * 0.55), emp = employedOf(b);
        h = 42 + 14 * cv.health[i] + 12 * cv.police[i] + 9 * cv.edu[i] + 15 * Math.min(1, cv.park[i]) + 6 * cv.fire[i] + 10 * Math.min(1, cv.landmark[i])
          - 38 * Math.min(1, cv.pollution[i]) - 12 * cv.noise[i] - (tax - 10) * 2.2
          + (wk ? (emp / wk - 0.75) * 24 : 0) + 4 * cv.transit[i];
        if (b.commute > 0) h += U.clamp((70 - b.commute) / 6, -14, 6);
        workers += wk; employed += emp;
        pop += b.res;
        eduSum += cv.edu[i] * b.res;
      } else {
        const fr = b.jobs ? (b.filled + b.outside) / b.jobs : 0;
        h = 42 + 10 * cv.police[i] + 6 * cv.fire[i] + 6 * cv.health[i] + fr * 22 - (tax - 10) * 2.2;
        if (z.cat === 'com') h += (b.custRatio - 0.6) * 30;
        if (z.cat === 'off') h += 10 * cv.edu[i] - 12 * Math.min(1, cv.pollution[i]);
        jobs += b.jobs; filled += b.filled; outsideIn += b.outside;
      }
      if (b.garbage > 100) h -= b.garbage > 200 ? 26 : 14;
      if (noConn) h -= 35;
      b.happy = U.clamp(b.happy + (U.clamp(h, 0, 100) - b.happy) * 0.25, 0, 100);
      if (res && b.res > 0) { happySum += b.happy * b.res; happyW += b.res; if (b.commute) { comm += b.commute; commN++; } }
      if (b.state === 'aband') {
        b.abandT++;
        if (b.abandT > 120) { toRemove.push(b); return; }
        if (b.happy > 45 && !noConn) { b.state = 'live'; b.abandT = 0; b.low = 0; CB.Meshes.refreshBuilding(b); }
        icons.push(iconFor(b, 'aband'));
        return;
      }
      // occupancy
      if (res) {
        if (!noConn && b.res < b.cap && resDemand > 3 && b.happy > 25) b.res = Math.min(b.cap, b.res + Math.max(1, Math.ceil((b.cap - b.res) * 0.4)));
        if (b.happy < 28 && b.res > 0 && S.rng() < 0.35) b.res = Math.max(0, b.res - Math.max(1, Math.ceil(b.res * 0.12)));
        const wk = Math.round(b.res * 0.55);
        let e = employedOf(b);
        while (e > wk && b.work.length) {
          const w = b.work[b.work.length - 1]; const o = S.buildings.get(w.id);
          const k = Math.min(w.n, e - wk); w.n -= k; e -= k; if (o) o.filled = Math.max(0, o.filled - k);
          if (w.n <= 0) b.work.pop();
        }
      } else {
        // outside commuters fill jobs when locals are lacking
        if (b.outside > 0 && b.filled + b.outside > b.jobs) b.outside = Math.max(0, b.jobs - b.filled);
      }
      // level up
      const lvReq = C.LV_REQ[b.level] || 999;
      const full = res ? b.res >= b.cap * 0.85 : (b.filled + b.outside) >= b.jobs * 0.7;
      if (b.level < 5 && b.happy > 55 && cv.lv[i] >= lvReq && full && !noConn) {
        b.prog += (b.happy - 45) / 100 * 0.12;
        if (b.prog >= 1) {
          b.prog = 0; b.level++;
          const old = b.cap; b.cap = S.capOf(b);
          if (!res) b.jobs = b.cap;
          CB.Meshes.refreshBuilding(b);
          if (CB.UI && CB.UI.selected === b) CB.Meshes.setSelection(b);
        }
      }
      // decline
      const failing = b.happy < 22 || (!res && b.age > 60 && (b.filled + b.outside) < b.jobs * 0.12);
      if (failing) b.low++; else b.low = Math.max(0, b.low - 2);
      if (b.low > 60) {
        b.state = 'aband'; b.abandT = 0;
        if (res) { releaseWork(b); b.res = 0; } else { S.buildings.forEach(o => { if (o.work.length) o.work = o.work.filter(w => w.id !== b.id); }); b.filled = 0; b.outside = 0; }
        CB.Meshes.refreshBuilding(b);
        return;
      }
      // problems
      if (noRoad) b.prob = 'noroad';
      else if (noConn) b.prob = 'noconn';
      else if (b.garbage > 100) b.prob = 'garbage';
      else if (!res && b.age > 36 && (b.filled + b.outside) < b.jobs * 0.3) b.prob = 'workers';
      else if (z.cat === 'com' && b.age > 48 && b.custRatio < 0.25) b.prob = 'customers';
      if (b.prob) icons.push(iconFor(b));
    });
    for (const b of toRemove) S.removeBuilding(b);
    const st = S.stats;
    st.pop = pop; st.workers = workers; st.employed = employed; st.jobs = jobs; st.filled = filled; st.outsideIn = outsideIn;
    st.happy = happyW ? happySum / happyW : 60;
    st.unemp = workers ? Math.max(0, 1 - employed / workers) : 0;
    st.edu = pop ? eduSum / pop : 0;
    st.commute = commN ? comm / commN : 0;
    st.buildingCount = S.buildings.size;
    S.icons = icons;
  }
  function iconFor(b, type) {
    const cx = (b.x + b.fw / 2) * T, cz = (b.y + b.fh / 2) * T;
    const h = b._h || (b._h = CB.Meshes.buildingHeight(b));
    return { x: cx, y: b.baseY + h + 4, z: cz, type: type || b.prob };
  }
  S.invalidateHeight = b => { b._h = 0; };

  // ------------------------------------------------------------------
  // Employment matching
  // ------------------------------------------------------------------
  function matchJobs() {
    const Wd = CB.World;
    const open = [];
    // locals can also take jobs currently held by out-of-town commuters
    S.buildings.forEach(b => { if (S.isWork(b) && b.state === 'live' && b.filled < b.jobs) open.push(b); });
    const res = [];
    S.buildings.forEach(b => { if (S.isRes(b) && b.state === 'live' && b.res > 0) res.push(b); });
    if (!res.length) return;
    let n = Math.min(res.length, 60);
    for (let k = 0; k < n && open.length; k++) {
      const b = res[(S.resRot++) % res.length];
      const wk = Math.round(b.res * 0.55);
      let emp = employedOf(b);
      if (emp >= wk || !Wd.conn[b.road]) continue;
      let best = null, bd = 1e9;
      for (let t = 0; t < 6; t++) {
        const o = open[Math.floor(S.rng() * open.length)];
        if (!Wd.conn[o.road]) continue;
        if (o.zone === 7 && S.rng() > S.cov.edu[S.centerTile(b)] * 0.85 + 0.15) continue;
        const d = U.dist(o.road, b.road) + S.rng() * 6;
        if (d < bd) { bd = d; best = o; }
      }
      if (!best) continue;
      // locals displace outside commuters
      const free = best.jobs - best.filled - best.outside + best.outside;
      const take = Math.min(wk - emp, free, 4);
      if (take <= 0) continue;
      const fromOutside = Math.max(0, best.filled + best.outside + take - best.jobs);
      best.outside = Math.max(0, best.outside - fromOutside);
      best.filled += take;
      const e = b.work.find(w => w.id === best.id);
      if (e) e.n += take; else b.work.push({ id: best.id, n: take });
      if (best.filled >= best.jobs) open.splice(open.indexOf(best), 1);
    }
    // commuters from outside when unemployment is low
    if (S.stats.unemp < 0.06) {
      for (const o of open.slice(0, 10)) {
        if (o.filled + o.outside >= o.jobs) continue;
        if (!Wd.conn[o.road]) continue;
        const maxOut = Math.ceil(o.jobs * 0.45);
        const add = Math.min(2, maxOut - o.outside, o.jobs - o.filled - o.outside);
        if (add > 0) o.outside += add;
      }
    }
  }

  // ------------------------------------------------------------------
  // Demand
  // ------------------------------------------------------------------
  function computeDemand() {
    const st = S.stats;
    let comJobs = 0, indJobs = 0, offJobs = 0, landmarks = 0;
    S.buildings.forEach(b => {
      if (b.kind === 'svc') { if (C.SERVICES[b.svc].cat === 'landmarks') landmarks++; return; }
      const cat = C.ZONES[b.zone].cat;
      const cap = b.state === 'build' ? S.capOf(b) : b.jobs;
      if (cat === 'com') comJobs += cap; else if (cat === 'ind') indJobs += cap; else if (cat === 'off') offJobs += cap;
    });
    let pending = 0;
    S.buildings.forEach(b => { if (S.isRes(b)) pending += b.state === 'build' ? S.capOf(b) : Math.max(0, b.cap - b.res); });
    const pop = st.pop;
    const workers = st.workers;
    const openJobs = Math.max(0, st.jobs - st.filled - st.outsideIn);
    // residential: base attractiveness + open jobs + happiness - taxes - unemployment
    let rd = 46 + 34 * U.clamp((openJobs - pending * 0.3) / Math.max(15, workers * 0.2), -1, 1)
      + (st.happy - 55) * 0.8 - (S.tax.res - 10) * 4.5 - Math.max(0, st.unemp - 0.08) * 160
      - Math.max(0, pending - 30 - pop * 0.05) * 0.4;
    if (pop < 80) rd = Math.max(rd, 80 - pending * 0.5);
    rd = U.clamp(rd, 0, 100);
    S.resDemandBase = rd;
    const w = U.clamp(pop / 6000, 0, 1);
    S.demand.rlow = U.clamp(rd * (1.05 - 0.55 * w), 0, 100);
    S.demand.rmed = S.unlocked(1) ? U.clamp(rd * (0.6 + 0.5 * w) + (pop > 400 ? 8 : 0), 0, 100) : 0;
    S.demand.rhigh = S.unlocked(4) ? U.clamp(rd * (0.4 + 0.8 * w) + 10, 0, 100) : 0;
    // workplaces: what residents need + workers looking for jobs
    const avail = U.clamp((st.unemp - 0.03) * 400, 0, 60);
    const comNeed = pop * 0.16 + landmarks * 25 + 6;
    S.demand.com = U.clamp(22 + 60 * U.clamp((comNeed - comJobs) / Math.max(8, comNeed * 0.3), -1, 1) - (S.tax.com - 10) * 4.5 + avail, 0, 100);
    const indNeed = pop * 0.19 + comJobs * 0.2 + 10;
    S.demand.ind = U.clamp(22 + 60 * U.clamp((indNeed - indJobs) / Math.max(8, indNeed * 0.3), -1, 1) - (S.tax.ind - 10) * 4.5 + avail, 0, 100);
    const offNeed = pop * 0.11 * (0.3 + st.edu);
    S.demand.off = S.unlocked(3) ? U.clamp(15 + 65 * U.clamp((offNeed - offJobs) / Math.max(8, offNeed * 0.3), -1, 1) - (S.tax.off - 10) * 4.5 + avail * 0.6, 0, 100) : 0;
  }
  S.zoneDemand = function (z) {
    const k = C.ZONES[z].key;
    if (k === 'rlow') return S.demand.rlow;
    if (k === 'rmed') return S.demand.rmed;
    if (k === 'rhigh') return S.demand.rhigh;
    if (k === 'clow' || k === 'chigh') return S.demand.com;
    if (k === 'ind') return S.demand.ind;
    return S.demand.off;
  };

  function growth() {
    if (S.lotsDirty) rebuildLots();
    let constructing = 0;
    S.buildings.forEach(b => { if (b.state === 'build') constructing++; });
    const maxCons = 10 + Math.floor(S.stats.pop / 25);
    for (let z = 1; z < C.ZONES.length; z++) {
      if (!S.unlocked(C.ZONES[z].unlock)) continue;
      const d = S.zoneDemand(z);
      if (d < 6 || !S.lots[z] || !S.lots[z].length) continue;
      const tries = (1 + Math.floor(d / 20)) * (C.ZONES[z].cat === 'res' ? 2 : 1);
      for (let t = 0; t < tries && constructing < maxCons; t++) {
        if (S.rng() < d / 100 * 0.95) { if (tryGrow(z)) constructing++; }
      }
    }
  }

  // ------------------------------------------------------------------
  // Fires & service vehicles
  // ------------------------------------------------------------------
  function svcInRange(b, cov, needVeh) {
    let best = null, bd = 1e9;
    S.buildings.forEach(s => {
      if (s.kind !== 'svc') return;
      const sv = C.SERVICES[s.svc];
      if (sv.cov !== cov) return;
      if (needVeh && s.vehOut >= (sv.vehCount || 0)) return;
      const d = Math.hypot(s.x + s.fw / 2 - b.x - b.fw / 2, s.y + s.fh / 2 - b.y - b.fh / 2);
      if (d < bd && CB.World.road[s.road] && CB.World.conn[s.road]) { bd = d; best = s; }
    });
    return best;
  }
  function startFire(b) {
    b.state = 'fire'; b.fire = 0;
    const st = svcInRange(b, 'fire', true);
    if (!st) return;
    st.vehOut++;
    const back = () => {
      CB.Traffic.request({ from: b.road, to: st.road, kind: 'fire', onArrive: () => { st.vehOut = Math.max(0, st.vehOut - 1); }, onFail: () => { st.vehOut = Math.max(0, st.vehOut - 1); } });
    };
    CB.Traffic.request({
      from: st.road, to: b.road, kind: 'fire', purpose: 'Responding to a fire',
      onArrive: (v, ok) => {
        if (S.buildings.has(b.id) && b.state === 'fire') { b.state = 'live'; b.fire = 0; CB.Meshes.refreshBuilding(b); }
        back();
      },
      onFail: () => { st.vehOut = Math.max(0, st.vehOut - 1); if (b.state === 'fire') { b.state = 'live'; } },
    });
  }
  function dispatchServices() {
    const Wd = CB.World;
    const all = [];
    S.buildings.forEach(b => all.push(b));
    for (const s of all) {
      if (s.kind !== 'svc' || !Wd.road[s.road] || !Wd.conn[s.road]) continue;
      const sv = C.SERVICES[s.svc];
      if (!sv.veh || s.vehOut >= sv.vehCount) continue;
      const cx = s.x + s.fw / 2, cy = s.y + s.fh / 2;
      if (sv.cov === 'garbage') {
        // pick the pile worth the trip: lots of garbage, not too far away
        let target = null, best = 0;
        for (let k = 0; k < 50; k++) {
          const b = all[Math.floor(S.rng() * all.length)];
          if (b.kind !== 'zone' || b.gTarget || b.garbage < 30 || !Wd.conn[b.road]) continue;
          const sc = b.garbage / (1 + Math.hypot(b.x - cx, b.y - cy) / 14);
          if (sc > best) { best = sc; target = b; }
        }
        if (!target) continue;
        target.gTarget = true; s.vehOut++;
        const collect = () => {
          const tx = target.x, ty = target.y;
          for (const o of all) if (o.kind === 'zone' && Math.abs(o.x - tx) <= 6 && Math.abs(o.y - ty) <= 6) o.garbage = 0;
          target.gTarget = false;
        };
        const done = () => { s.vehOut = Math.max(0, s.vehOut - 1); };
        CB.Traffic.request({
          from: s.road, to: target.road, kind: 'garbage', purpose: 'Collecting garbage',
          onArrive: (v, ok) => { if (ok) collect(); else target.gTarget = false; CB.Traffic.request({ from: target.road, to: s.road, kind: 'garbage', purpose: 'Returning to depot', onArrive: done, onFail: done }); },
          onFail: (why) => { if (why === 'cap') collect(); target.gTarget = false; done(); },
        });
      } else if ((sv.cov === 'police' || sv.cov === 'health') && S.rng() < (sv.cov === 'police' ? 0.55 : 0.3)) {
        // nearby calls are more likely than far ones
        let target = null, bd = 1e9;
        for (let k = 0; k < 6; k++) { const b = all[Math.floor(S.rng() * all.length)]; if (b.kind !== 'zone' || b.state !== 'live') continue; const d = Math.hypot(b.x - cx, b.y - cy) * (0.6 + S.rng()); if (d < bd) { bd = d; target = b; } }
        if (!target) continue;
        s.vehOut++;
        const done = () => { s.vehOut = Math.max(0, s.vehOut - 1); };
        CB.Traffic.request({
          from: s.road, to: target.road, kind: sv.veh, purpose: sv.cov === 'police' ? 'On patrol' : 'Medical call',
          onArrive: () => CB.Traffic.request({ from: target.road, to: s.road, kind: sv.veh, purpose: 'Returning to station', onArrive: done, onFail: done }),
          onFail: done,
        });
      }
    }
  }

  // ------------------------------------------------------------------
  // Trips (agents)
  // ------------------------------------------------------------------
  const gauss = (h, mu, s) => Math.exp(-0.5 * ((h - mu) / s) ** 2) / (s * 2.5066);
  function dayCurve(h) { return h < 6 || h > 22 ? 0.01 : (h < 9 || h > 19 ? 0.05 : 0.075); }
  function carColor() { return U.pick(CB.Meshes.CAR_COLORS, S.rng); }
  function randomOf(list) { return list.length ? list[Math.floor(S.rng() * list.length)] : null; }

  let resList = [], comList = [], indList = [], workList = [], visitList = [], parkList = [];
  function refreshLists() {
    resList = []; comList = []; indList = []; workList = []; visitList = []; parkList = [];
    S.buildings.forEach(b => {
      if (b.state !== 'live' || !CB.World.conn[b.road]) return;
      if (b.kind === 'svc') { const c = C.SERVICES[b.svc].cat; if (c === 'landmarks' || (c === 'parks' && b.w > 1)) visitList.push(b); if (c === 'parks' || c === 'landmarks') parkList.push(b); return; }
      const cat = C.ZONES[b.zone].cat;
      if (cat === 'res') { if (b.res > 0) resList.push(b); }
      else { workList.push(b); if (cat === 'com') { comList.push(b); visitList.push(b); } if (cat === 'ind') indList.push(b); }
    });
  }

  // ---------------- mode choice ----------------
  // Households own cars at different rates by density; short trips are walked, medium trips
  // are cycled when the route feels safe, and the rest pick between transit and the car.
  const CAR_OWN = [0.9, 0.88, 0.62, 0.42];
  const BIKE_OWN = 0.72;
  function recordMode(m) { const M = CB.Traffic.mode; for (const k in M) M[k] += ((k === m ? 1 : 0) - M[k]) * 0.01; }
  S.chooseMode = function (dist, hasCar, safety, transit, carT) {
    // dist: route length in tiles. safety: 0..1 bike comfort of the best bike route (or -1 if none).
    // transit: transit route time or null. carT: estimated car time.
    const r = S.rng;
    const pWalk = dist <= 7 ? 0.85 : dist <= 20 ? 0.85 * (20 - dist) / 13 : 0;
    if (r() < pWalk) return 'walk';
    if (safety >= 0 && dist <= 70) {
      const fd = dist <= 30 ? 1 : (70 - dist) / 40;
      const pBike = BIKE_OWN * fd * (0.08 + 0.92 * Math.pow(safety, 1.5));
      if (r() < pBike) return 'bike';
    }
    if (transit) {
      const p = hasCar ? 1 / (1 + Math.exp((transit - carT * 1.3) / 10)) : 1;
      if (r() < p * 0.92 + 0.04) return 'transit';
    }
    if (hasCar) return 'car';
    if (safety >= 0 && dist <= 90) return 'bike';
    if (dist <= 40) return 'walk';
    return 'car'; // taxi / ride from a friend
  };
  function softTrip(kind, path, done, fb, tb) {
    const est = path.length * T / (kind === 'bike' ? 11 : 4.5);
    const a = CB.Traffic.spawnSoft(kind, path, (t) => done && done(t, true), fb, tb);
    if (!a && done) done(est, true);
  }
  function personTrip(fromTile, toTile, purpose, n, done, zone, fb, tb) {
    const dist = U.dist(fromTile, toTile);
    const hasCar = S.rng() < (CAR_OWN[zone] || 0.85);
    let bikePath = null, safety = -1;
    if (dist > 4 && dist <= 90) { bikePath = CB.Traffic.findSoftPath(fromTile, toTile, true); if (bikePath) safety = CB.Traffic.bikeSafety(bikePath); }
    const carT = dist * T / (13 * C.VEH_SPEED) * (1 + 1.8 * (1 - CB.Traffic.stats.flow)) + 14;
    const r = dist > 6 ? CB.Transit.route(fromTile, toTile) : null;
    const mode = S.chooseMode(dist, hasCar, safety, r ? r.time : null, carT);
    recordMode(mode);
    if (mode === 'walk') {
      const p = dist <= 40 ? CB.Traffic.findSoftPath(fromTile, toTile, false) : null;
      if (p) { softTrip('ped', p, done, fb, tb); return; }
    } else if (mode === 'bike' && bikePath) { softTrip('bike', bikePath, done, fb, tb); return; }
    else if (mode === 'transit' && r) {
      S.stats.transitShare += (1 - S.stats.transitShare) * 0.01;
      r._t0 = CB.Traffic.time;
      CB.Transit.addPassenger(r, n, () => done && done(CB.Traffic.time - r._t0, true));
      return;
    }
    S.stats.transitShare *= 0.99;
    carTrip(fromTile, toTile, purpose, n, done, null, fb, tb);
  }
  function carTrip(from, to, purpose, n, onArrive, kind, fb, tb) {
    const pub = CB.Traffic.isPublic(tb);
    CB.Traffic.request({
      from, to, fromB: fb || null, toB: tb || null, kind: kind || (S.rng() < 0.3 ? 'suv' : 'car'), col: kind === 'truck' || kind === 'van' ? null : carColor(), purpose,
      onArrive: (v, ok) => { if (ok && pub) CB.Traffic.spawnVisitors(tb, 1 + (S.rng() < 0.5 ? 1 : 0), 40); if (onArrive) onArrive(ok ? CB.Traffic.time - v.born : 120, ok); },
      onFail: (why) => { if (why === 'cap' && onArrive) onArrive(U.dist(from, to) * T / 16 + 10, true); },
    });
  }
  function recordCommute(b) {
    return (t, ok) => {
      if (!S.buildings.has(b.id)) return;
      const v = ok ? t : 150;
      b.commute = b.commute ? b.commute * 0.8 + v * 0.2 : v;
    };
  }
  // shift starts: most people start between 7 and 9, some late morning, some afternoon/evening
  const toWorkCurve = h => 0.5 * gauss(h, 7.2, 0.7) + 0.28 * gauss(h, 8.5, 0.8) + 0.12 * gauss(h, 11.5, 1.4) + 0.1 * gauss(h, 15.5, 1.6);
  const toHomeCurve = h => 0.5 * gauss(h, 16.2, 0.9) + 0.28 * gauss(h, 17.6, 1.0) + 0.12 * gauss(h, 20.5, 1.4) + 0.1 * (gauss(h, 23.6, 1.4) + gauss(h, -0.4, 1.4));

  function generateTrips(dtH) {
    if (!resList.length && !workList.length) return;
    const h = S.hour, st = S.stats, A = S.acc, Wd = CB.World;
    const cars = CB.Gfx.settings.cars;
    const ppc = Math.max(1, st.employed / (cars * 0.6));
    const toWork = toWorkCurve(h), toHome = toHomeCurve(h);
    A.work += st.employed * toWork * dtH / ppc;
    A.home += st.employed * toHome * dtH / ppc;
    A.shop += st.pop * 0.22 * dayCurve(h) * dtH / ppc;
    let indF = 0; for (const b of indList) indF += b.filled + b.outside;
    A.freight += indF * 0.14 * dayCurve(h) * dtH / Math.max(1, ppc * 1.2) + comList.length * 0.05 * dayCurve(h) * dtH / Math.max(1, ppc * 0.5);
    A.visit += (st.pop * 0.015 + visitList.length * 2) * dayCurve(h) * dtH / ppc;
    A.cin += st.outsideIn * toWork * dtH / ppc;
    A.cout += st.outsideIn * toHome * dtH / ppc;
    const inT = Wd.outIn, outT = Wd.outOut;
    let guard = 0;
    while (A.work >= 1 && guard++ < 30) {
      A.work--;
      const b = randomOf(resList); if (!b || !b.work.length) continue;
      const w = S.buildings.get(U.pick(b.work, S.rng).id); if (!w) continue;
      personTrip(b.road, w.road, 'Commuting to work', ppc, recordCommute(b), b.zone, b, w);
    }
    while (A.home >= 1 && guard++ < 60) {
      A.home--;
      const b = randomOf(resList); if (!b || !b.work.length) continue;
      const w = S.buildings.get(U.pick(b.work, S.rng).id); if (!w) continue;
      personTrip(w.road, b.road, 'Heading home', ppc, recordCommute(b), b.zone, w, b);
    }
    while (A.shop >= 1 && guard++ < 90) {
      A.shop--;
      const b = randomOf(resList); if (!b || !comList.length) continue;
      let best = null, bd = 1e9;
      for (let k = 0; k < 5; k++) { const c = randomOf(comList); const d = U.dist(c.road, b.road) + S.rng() * 8; if (d < bd) { bd = d; best = c; } }
      if (!best) continue;
      const shop = best;
      personTrip(b.road, shop.road, 'Going shopping', ppc, () => { if (S.buildings.has(shop.id)) shop.cust += ppc * C.TRIP_K; }, b.zone, b, shop);
    }
    while (A.freight >= 1 && guard++ < 110) {
      A.freight--;
      const src = indList.length && S.rng() < 0.7 ? randomOf(indList) : null;
      if (src) {
        const dst = comList.length && S.rng() < 0.65 ? randomOf(comList) : null;
        if (dst) carTrip(src.road, dst.road, 'Delivering goods', 1, null, 'truck', src, dst);
        else carTrip(src.road, outT, 'Exporting goods', 1, null, 'truck', src, null);
      } else if (comList.length) { const dst = randomOf(comList); carTrip(inT, dst.road, 'Importing goods', 1, null, 'truck', null, dst); }
    }
    while (A.visit >= 1 && guard++ < 130) {
      A.visit--;
      const tgt = randomOf(visitList); if (!tgt) continue;
      carTrip(inT, tgt.road, 'Visiting the city', ppc, () => { if (S.buildings.has(tgt.id) && tgt.kind === 'zone') tgt.cust += ppc * C.TRIP_K; }, null, null, tgt);
    }
    while (A.cin >= 1 && guard++ < 150) {
      A.cin--;
      const w = randomOf(workList); if (!w || !w.outside) continue;
      carTrip(inT, w.road, 'Commuting from out of town', ppc, null, null, null, w);
    }
    while (A.cout >= 1 && guard++ < 170) {
      A.cout--;
      const w = randomOf(workList); if (!w || !w.outside) continue;
      carTrip(w.road, outT, 'Leaving town', ppc, null, null, w, null);
    }
    // residents heading to a park or plaza nearby
    A.park = (A.park || 0) + st.pop * 0.03 * dayCurve(h) * dtH / ppc;
    while (A.park >= 1 && guard++ < 190) {
      A.park--;
      const b = randomOf(resList); if (!b || !parkList.length) continue;
      let best = null, bd = 1e9;
      for (let k = 0; k < 4; k++) { const p = randomOf(parkList); const d = U.dist(p.road, b.road); if (d < bd) { bd = d; best = p; } }
      if (best && bd < 60) personTrip(b.road, best.road, 'Going to the park', ppc, null, b.zone, b, best);
    }
    for (const k in A) if (A[k] > 40) A[k] = 40;
  }

  function moveIn(b) {
    const inT = CB.World.outIn;
    if (inT === undefined || !CB.World.conn[b.road]) return;
    const n = Math.ceil(b.cap * 0.5);
    CB.Traffic.request({
      from: inT, to: b.road, toB: b, kind: 'van', purpose: 'Moving in',
      onArrive: () => { if (S.buildings.has(b.id)) b.res = Math.min(b.cap, b.res + n); },
      onFail: () => { if (S.buildings.has(b.id)) b.res = Math.min(b.cap, b.res + n); },
    });
  }

  // ------------------------------------------------------------------
  // Economy
  // ------------------------------------------------------------------
  function hourlyEconomy() {
    const Wd = CB.World, B = S.budget;
    let res = 0, com = 0, ind = 0, off = 0, svc = 0;
    S.buildings.forEach(b => {
      if (b.kind === 'svc') { svc += C.SERVICES[b.svc].upkeep; return; }
      if (b.state !== 'live') return;
      const z = C.ZONES[b.zone], L = b.level - 1;
      if (z.cat === 'res') res += b.res * (3.0 + 0.5 * L);
      else {
        const wk = b.filled + b.outside;
        if (z.cat === 'com') com += wk * (3.4 + 0.5 * L) * (0.55 + 0.45 * Math.min(1.2, b.custRatio));
        else if (z.cat === 'ind') ind += wk * (3.2 + 0.4 * L);
        else off += wk * (4.4 + 0.6 * L);
      }
    });
    const inc = { res: res * S.tax.res / 10 / 24, com: com * S.tax.com / 10 / 24, ind: ind * S.tax.ind / 10 / 24, off: off * S.tax.off / 10 / 24 };
    let roads = 0;
    for (let i = 0; i < N; i++) {
      if (Wd.road[i] && U.inPlay(U.tx(i), U.ty(i))) { const R = C.ROADS[Wd.road[i]]; roads += R.upkeep / R.w; }
      if (Wd.pmask[i]) for (let q = 0; q < 4; q++) { const k = Wd.pcell[Wd.cellOf(i, q)]; if (k) roads += C.PATHS[k].upkeep; }
      if (Wd.rail[i]) roads += C.RAIL[Wd.rail[i]].upkeep;
    }
    let transit = 0;
    for (const l of CB.Transit.lines) transit += l.vehicles * C.TRANSIT[l.type].upkeep;
    let loans = 0; for (const l of S.loans) loans += l.payment;

      if (e.button === 0 && !mouse.touchPan) onDown();
    });
    el.addEventListener('pointermove', e => {
      const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y;
      mouse.x = e.clientX; mouse.y = e.clientY;
      if (Math.abs(mouse.x - mouse.sx) + Math.abs(mouse.y - mouse.sy) > 4) mouse.moved = true;
      const cam = CB.Gfx.cam;
      if (mouse.down && (mouse.btn === 2 || (mouse.btn === 0 && e.altKey))) {
        cam.yaw -= dx * 0.005; cam.pitch = U.clamp(cam.pitch + dy * 0.004, 0.12, 1.45);
      } else if (mouse.down && (mouse.btn === 1 || mouse.touchPan)) {
        const k = cam.dist * 0.0016;
        const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
        cam.tx += (-dx * rx + dy * fx) * k; cam.tz += (-dx * rz + dy * fz) * k;
      }
      Tl.needHover = true;
    });
    el.addEventListener('pointerup', e => {
      if (mouse.btn === 0 && !mouse.touchPan) onUp(e);
      if (mouse.btn === 2 && !mouse.moved) onRightClick();
      mouse.down = false; mouse.btn = -1;
    });
    el.addEventListener('wheel', e => {
      e.preventDefault();
      CB.Gfx.cam.tdist *= Math.exp(e.deltaY * 0.0011);
    }, { passive: false });
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', e => { CB.Gfx.cam.keys[keyName(e)] = false; });
    window.addEventListener('blur', () => { CB.Gfx.cam.keys = {}; });
  };
  function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key; }
  function onKey(e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
    const k = keyName(e);
    const S = CB.Sim;
    if (k === 'r' && Tl.tool.type === 'svc') { Tl.rot = (Tl.rot + 1) % 4; Tl.needHover = true; return; }
    CB.Gfx.cam.keys[k] = true;
    if (e.key === 'Shift') CB.Gfx.cam.keys.Shift = true;
    if (k === ' ') { e.preventDefault(); CB.UI.setSpeed(S.speed === 0 ? (CB.UI.lastSpeed || 1) : 0); }
    else if (k === '1') CB.UI.setSpeed(1);
    else if (k === '2') CB.UI.setSpeed(2);
    else if (k === '3') CB.UI.setSpeed(4);
    else if (k === 'Escape') {
      if (Tl.tool.type === 'line' && Tl.lineStops.length) { Tl.lineStops = []; refreshLinePreview(); }
      else if (Tl.tool.type !== 'select') Tl.setTool(null);
      else { CB.UI.select(null); CB.UI.closePanels(); }
    }
    else if (k === 'b') { CB.UI.openCat(null); Tl.setTool(Tl.tool.type === 'bulldoze' ? null : { type: 'bulldoze' }); }
    else if (k === 'Enter' && Tl.tool.type === 'line') finishLine();
    else if (k === 'Backspace' && Tl.tool.type === 'line') { Tl.lineStops.pop(); refreshLinePreview(); }
  }
  function onRightClick() {
    if (Tl.tool.type === 'line' && Tl.lineStops.length) { Tl.lineStops.pop(); refreshLinePreview(); }
    else if (Tl.tool.type !== 'select' && !mouse.moved) Tl.setTool(null);
  }

  function onDown() {
    const h = Tl.hover; if (!h || h.i < 0) return;
    const t = Tl.tool.type;
    if (t === 'road' || t === 'rail' || t === 'zone' || t === 'dezone' || t === 'bulldoze') Tl.drag = { start: h.i };
    if (t === 'path') Tl.drag = { start: h.i, f: fcellAt(h) };
  }
  function onUp() {
    const h = Tl.hover;
    const t = Tl.tool;
    const S = CB.Sim, Wd = CB.World;
    if (t.type === 'select') {
      if (mouse.moved || !h) return;
      const v = CB.Traffic.pick(h.x, h.z, 6);
      const bid = h.i >= 0 ? Wd.bld[h.i] : 0;
      if (bid) { CB.UI.select(S.buildings.get(bid)); return; }
      if (v) { CB.UI.selectVehicle(v); return; }
      const st = h.i >= 0 && CB.Transit.stops.find(s => s.tile === h.i);
      if (st) { CB.UI.selectStop(st); return; }
      CB.UI.select(null);
      return;
    }
    if (t.type === 'road' && Tl.drag) {
      const strips = roadStrips(Tl.drag.start, h ? h.i : Tl.drag.start, t.rt);
      const ev = roadEval(strips, t.rt);
      Tl.drag = null; clearPreview();
      if (ev.bad) { CB.UI.toast(ev.bad, 'bad'); return; }
      if (!spend(ev.cost)) return;
      if (placeRoad(strips, t.rt)) { S.networkChanged(); CB.UI.sfx('build'); }
      return;
    }
    if (t.type === 'path' && Tl.drag) {
      const cells = lPathF(Tl.drag.f, h ? fcellAt(h) : Tl.drag.f);
      const ev = pathEval(cells, t.pk);
      Tl.drag = null; clearPreview();
      if (ev.bad) { CB.UI.toast(ev.bad, 'bad'); return; }
      if (!spend(ev.cost)) return;
      for (const f of cells) {
        Wd.setPath(f, t.pk);
        const i = U.idx((f % FW) >> 1, ((f / FW) | 0) >> 1);
        Wd.zone[i] = 0; Wd.tree[i] = 0; CB.Meshes.markInfra(i);
      }
      CB.Meshes.treesDirty = true;
      S.networkChanged(); CB.UI.sfx('build');
      return;
    }
    if (t.type === 'junction') {
      if (!h || h.i < 0) return;
      const cl = junctionNear(h.i);
      if (!cl) { CB.UI.toast('Click on an intersection', 'bad'); return; }
      if (t.apply) { CB.UI.setJunctionCtrl(cl.tiles[0], t.apply); CB.UI.sfx('click'); if (CB.UI.junctionTile >= 0) CB.UI.openJunction(cl.tiles[0]); }
      else CB.UI.openJunction(cl.tiles[0]);
      return;
    }
    if (t.type === 'rail' && Tl.drag) {
      const tiles = lPath(Tl.drag.start, h ? h.i : Tl.drag.start);
      const ev = railEval(tiles, t.rr);
      Tl.drag = null; clearPreview();
      if (ev.bad) { CB.UI.toast(ev.bad, 'bad'); return; }
      if (!spend(ev.cost)) return;
      for (const i of tiles) if (Wd.rail[i] !== t.rr) S.setRail(i, t.rr);
      S.networkChanged(); CB.UI.sfx('build');
      return;
    }
    if ((t.type === 'zone' || t.type === 'dezone') && Tl.drag) {
      const r = rectOf(Tl.drag.start, h ? h.i : Tl.drag.start);
      Tl.drag = null; CB.Gfx.uni.uBrushOn.value = 0;
      let n = 0;
      for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) {
        const i = U.idx(x, y);
        if (S.setZone(i, t.type === 'zone' ? t.z : 0)) n++;
      }
      if (n) { CB.Meshes.updateZoneTex(true); CB.UI.sfx('zone'); }
      return;
    }
    if (t.type === 'bulldoze' && Tl.drag) {
      const r = rectOf(Tl.drag.start, h ? h.i : Tl.drag.start);
      Tl.drag = null; CB.Gfx.uni.uBrushOn.value = 0;
      bulldoze(r);
      return;
    }
    if (!h || h.i < 0) return;
    if (t.type === 'svc') {
      const sv = C.SERVICES[t.key];
      const lot = S.serviceLot(t.key, h.tx, h.ty, Tl.rot);
      if (!lot.ok) { CB.UI.toast(lot.reason, 'bad'); return; }
      if (!spend(sv.cost)) return;
      const b = S.placeService(t.key, lot);
      CB.Meshes.updateZoneTex(false);
      CB.UI.sfx('build');
      CB.UI.toast(sv.name + ' built.', 'good');
      return;
    }
    if (t.type === 'stop') {
      const why = CB.Transit.canPlaceStop(t.st, h.i);
      if (why) { CB.UI.toast(why, 'bad'); return; }
      const cost = stopCost(t.st, h.i);
      if (!spend(cost)) return;
      CB.Transit.addStop(t.st, h.i);
      CB.UI.sfx('build');
      return;
    }
    if (t.type === 'line') { lineClick(h.i); return; }
  }
  function stopCost(type, i) {
    if (type !== 'rail') return C.TRANSIT[type].stopCost;
    return CB.World.rail[i] === 2 ? C.TRANSIT.rail.ugStopCost : C.TRANSIT.rail.stopCost;
  }
  function rectOf(a, b) {
    return { x0: Math.min(U.tx(a), U.tx(b)), x1: Math.max(U.tx(a), U.tx(b)), y0: Math.min(U.ty(a), U.ty(b)), y1: Math.max(U.ty(a), U.ty(b)) };
  }
  function bulldoze(r) {
    const S = CB.Sim, Wd = CB.World, X = CB.Transit;
    let net = false, refund = 0, any = false;
    const single = r.x0 === r.x1 && r.y0 === r.y1;
    const killB = i => {
      const b = S.buildings.get(Wd.bld[i]);
      if (b) { if (b.kind === 'svc') refund += C.SERVICES[b.svc].cost * 0.25; S.removeBuilding(b); any = true; }
    };
    const killStops = i => { for (const s of X.stops.filter(s => s.tile === i)) { X.removeStop(s); any = true; } };
    const killPath = i => { for (let q = 0; q < 4; q++) Wd.setPath(Wd.cellOf(i, q), 0); CB.Meshes.markInfra(i); net = true; any = true; };
    const killRail = i => { S.setRail(i, 0); net = true; any = true; };
    const killRoad = i => {
      const R = C.ROADS[Wd.road[i]]; if (!R) return;
      refund += R.cost / R.w * 0.5;
      if (i === Wd.outIn || i === Wd.outOut) return; // the highway to the outside world stays
      Wd.unlinkAll(i); S.setRoad(i, 0); Wd.rdir[i] = 0; Wd.rpart[i] = 0; net = true; any = true;
    };
    if (single) {
      if (!U.inPlay(r.x0, r.y0)) return;
      const i = U.idx(r.x0, r.y0);
      if (Wd.bld[i]) killB(i);
      else if (Wd.pmask[i]) killPath(i);
      else if (X.stops.some(s => s.tile === i)) killStops(i);
      else if (Wd.rail[i]) killRail(i);
      else if (Wd.road[i]) {
        // remove the whole cross-section of a dual carriageway
        const p = Wd.rpart[i], rt = Wd.road[i];
        killRoad(i);
        if (p) { const j = Wd.neighbor(i, p - 1); if (j >= 0 && Wd.road[j] === rt && Wd.jcl[j] < 0) killRoad(j); }
      }
    } else {
      for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) {
        if (!U.inPlay(x, y)) continue;
        const i = U.idx(x, y);
        if (Wd.bld[i]) killB(i);
        if (Wd.pmask[i]) killPath(i);
        killStops(i);
        if (Wd.rail[i]) killRail(i);
        if (Wd.road[i]) killRoad(i);
      }
    }
    if (net) S.networkChanged();
    if (refund) S.money += refund;
    if (any) { CB.Meshes.updateZoneTex(false); CB.UI.sfx('demolish'); }
  }

  // ---------------- transit lines ----------------
  function lineClick(i) {
    const X = CB.Transit, type = Tl.tool.lt;
    let s = X.stopAtTile(i, type);
    if (!s) {
      const why = X.canPlaceStop(type, i);
      if (why) { CB.UI.toast(why, 'bad'); return; }
      if (!spend(stopCost(type, i))) return;
      s = X.addStop(type, i);
    }
    const L = Tl.lineStops;
    if (L.length >= 2 && s.id === L[0]) { finishLine(); return; }
    if (L.includes(s.id)) return;
    // check that the new stop is reachable
    if (L.length) {
      const prev = X.stopById(L[L.length - 1]);
      const p = CB.Transit.segPath(type, prev.tile, s.tile);
      if (!p) { CB.UI.toast(type === 'rail' ? 'No track connects these stations' : type === 'tram' ? 'No tram track connects these stops' : 'No road connects these stops (check one-way streets)', 'bad'); return; }
    }
    L.push(s.id);
    CB.UI.sfx('click');
    refreshLinePreview();
  }
  function finishLine() {
    const X = CB.Transit;
    if (Tl.lineStops.length < 2) { CB.UI.toast('A line needs at least two stops', 'bad'); return; }
    const l = X.createLine(Tl.tool.lt, Tl.lineStops);
    Tl.lineStops = [];
    refreshLinePreview();
    if (l.broken) CB.UI.toast('The line cannot loop back to its first stop. Check that roads or tracks connect.', 'bad');
    else { CB.UI.toast(l.name + ' created with ' + l.stops.length + ' stops.', 'good'); CB.UI.sfx('build'); }
    CB.UI.refreshTransit();
  }
  function refreshLinePreview(hoverTile) {
    const Mx = CB.Meshes, X = CB.Transit, Wd = CB.World;
    if (Tl.previewRibbon) { Mx.lineGroup.remove(Tl.previewRibbon); Tl.previewRibbon.geometry.dispose(); Tl.previewRibbon = null; }
    const L = Tl.lineStops.map(id => X.stopById(id)).filter(Boolean);
    const tiles = L.map(s => s.tile);
    if (hoverTile !== undefined && hoverTile >= 0 && tiles.length) tiles.push(hoverTile);
    if (tiles.length < 2) return;
    const pts = [];
    const type = Tl.tool.lt;
    for (let k = 0; k < tiles.length - 1; k++) {
      const p = CB.Transit.segPath(type, tiles[k], tiles[k + 1]);
      if (!p) continue;
      for (const i of p) {
        const x = (U.tx(i) + 0.5) * T, z = (U.ty(i) + 0.5) * T;
        const y = type !== 'rail' ? Wd.roadH(x, z) + 2 : (Wd.rail[i] === 1 ? Wd.deckH(x, z) + 2 : Math.max(Wd.groundH(x, z), 0) + 2.5);
        pts.push(x, y, z);
      }
    }
    Tl.previewRibbon = Mx.ribbon(pts, 2.2, '#ffffff', false);
    if (Tl.previewRibbon) Mx.lineGroup.add(Tl.previewRibbon);
  }

  // test hook: perform a tool action from tile a to tile b as if the player dragged
  Tl._simulate = function (tool, a, b) {
    Tl.setTool(tool);
    const mk = i => ({ i, tx: U.tx(i), ty: U.ty(i), x: (U.tx(i) + 0.5) * T, z: (U.ty(i) + 0.5) * T });
    Tl.hover = mk(a);
    mouse.moved = false;
    onDown();
    Tl.hover = mk(b);
    onUp();
  };

  Tl._simulateAt = function (tool, ax, az, bx, bz) {
    Tl.setTool(tool);
    const mk = (x, z) => { const tx = Math.floor(x / T), ty = Math.floor(z / T); return { i: U.idx(tx, ty), tx, ty, x, z }; };
    Tl.hover = mk(ax, az); mouse.moved = false; onDown();
    Tl.hover = mk(bx, bz); onUp();
  };

  // ---------------- per-frame hover & previews ----------------
  Tl.update = function () {
    const G = CB.Gfx, Mx = CB.Meshes, Wd = CB.World, S = CB.Sim;
    if (Tl.needHover || Tl.drag || Tl.tool.type !== 'select') {
      Tl.needHover = false;
      Tl.hover = G.pick(mouse.x, mouse.y);
    }
    const h = Tl.hover, t = Tl.tool;
    if (!h || h.i < 0) { if (t.type !== 'select') { Mx.setGhostTiles([]); Mx.setGhostBox(null); Mx.setRing(null); } Tl.tip = ''; return; }
    if (t.type === 'road') {
      const strips = roadStrips(Tl.drag ? Tl.drag.start : h.i, h.i, t.rt);
      const ev = roadEval(strips, t.rt);
      Mx.setGhostTiles(ev.list);
      Mx.setFlowArrows(strips, t.rt);
      const R = C.ROADS[t.rt];
      Tl.tip = R.name + ' · ' + (Tl.drag ? strips[0].tiles.length + ' tiles · ' : '') + U.money(ev.cost) + (ev.bad ? ' · ' + ev.bad : (R.oneway ? ' · drag in the direction of travel' : ''));
    } else if (t.type === 'path') {
      const cells = Tl.drag ? lPathF(Tl.drag.f, fcellAt(h)) : [fcellAt(h)];
      const ev = pathEval(cells, t.pk);
      Mx.setGhostTiles(ev.list);
      Tl.tip = C.PATHS[t.pk].name + ' · ' + U.money(ev.cost) + (ev.bad ? ' · ' + ev.bad : ' · joins sidewalks it touches');
    } else if (t.type === 'junction') {
      const cl = junctionNear(h.i);
      Mx.setGhostTiles(cl ? cl.tiles.map(i => ({ i, ok: true, h: 0.6, col: [0.4, 0.8, 1] })) : []);
      const nm = { lights: 'add traffic lights', stop: 'add stop signs', allstop: 'make it an all-way stop', round: 'make it a roundabout', none: 'remove all control', auto: 'reset to automatic' };
      Tl.tip = cl ? (t.apply ? 'Click to ' + nm[t.apply] : 'Click to edit this intersection') : 'Hover an intersection';
    } else if (t.type === 'rail') {
      const tiles = Tl.drag ? lPath(Tl.drag.start, h.i) : [h.i];
      const ev = railEval(tiles, t.rr);
      Mx.setGhostTiles(ev.list);
      Tl.tip = (Tl.drag ? tiles.length + ' tiles · ' : '') + U.money(ev.cost) + (ev.bad ? ' · ' + ev.bad : '');
    } else if (t.type === 'zone' || t.type === 'dezone' || t.type === 'bulldoze') {
      const r = Tl.drag ? rectOf(Tl.drag.start, h.i) : rectOf(h.i, h.i);
      G.uni.uBrushOn.value = 1;
      G.uni.uBrush.value.set(r.x0 * T, r.y0 * T, (r.x1 + 1) * T, (r.y1 + 1) * T);
      if (t.type === 'zone') { const c = U.hex(C.ZONES[t.z].color); G.uni.uBrushCol.value.setRGB(c[0], c[1], c[2]); }
      else G.uni.uBrushCol.value.setRGB(1, 0.3, 0.25);
      if (t.type === 'bulldoze') {
        const bid = Wd.bld[h.i];
        const b = bid && S.buildings.get(bid);
        if (b && !Tl.drag) {
          Mx.setGhostBox(b.x * T, b.y * T, (b.x + b.fw) * T, (b.y + b.fh) * T, b.baseY - 0.5, 3, false);
          Tl.tip = 'Demolish ' + b.name;
        } else { Mx.setGhostBox(null); Tl.tip = Tl.drag ? 'Release to demolish everything in the area' : 'Click or drag to demolish'; }
      } else {
        const z = Wd.zonable[h.i];
        Tl.tip = t.type === 'zone' ? (z ? C.ZONES[t.z].name : 'Zones must be within 3 tiles of a road') : 'Remove zoning';
      }
    } else if (t.type === 'svc') {
      const sv = C.SERVICES[t.key];
      const lot = S.serviceLot(t.key, h.tx, h.ty, Tl.rot);
      const y = Math.max(Wd.groundH((lot.x + lot.fw / 2) * T, (lot.y + lot.fh / 2) * T), 0);
      Mx.setGhostBox(lot.x * T, lot.y * T, (lot.x + lot.fw) * T, (lot.y + lot.fh) * T, y, 9, lot.ok);
      Mx.setRing(null);
      Tl.tip = sv.name + ' · ' + U.money(sv.cost) + (lot.ok ? ' · R to rotate' : ' · ' + lot.reason);
    } else if (t.type === 'stop') {
      const why = CB.Transit.canPlaceStop(t.st, h.i);
      Mx.setGhostTiles([{ i: h.i, ok: !why, y: t.st === 'rail' && Wd.rail[h.i] === 1 ? Wd.deckH(h.x, h.z) : undefined, h: 3 }]);
      Tl.tip = why || (({ bus: 'Bus stop', tram: 'Streetcar stop', rail: 'Station' })[t.st] + ' · ' + U.money(stopCost(t.st, h.i)));
    } else if (t.type === 'line') {
      const X = CB.Transit;
      const s = X.stopAtTile(h.i, t.lt);
      if (Tl._lastHoverTile !== h.i) { Tl._lastHoverTile = h.i; refreshLinePreview(h.i); }
      Mx.setGhostTiles([{ i: h.i, ok: !!s || !X.canPlaceStop(t.lt, h.i), h: 2 }]);
      const L = Tl.lineStops;
      if (s && L.length >= 2 && s.id === L[0]) Tl.tip = 'Click to finish the line';
      else if (s) Tl.tip = s.name + (L.length ? ' · add to line' : ' · start line here');
      else Tl.tip = X.canPlaceStop(t.lt, h.i) || ('New ' + (t.lt === 'rail' ? 'station' : 'stop') + ' · ' + U.money(stopCost(t.lt, h.i)));
    } else {
      Tl.tip = '';
      if (h.i >= 0) {
        const bid = Wd.bld[h.i];
        Tl.hoverB = bid ? S.buildings.get(bid) : null;
      }
    }
  };
})();

</script>
<script>
'use strict';
// Open Skylines — DOM interface: top bar, tool dock, panels, info views, goals, toasts
(function () {
  const { C, U } = CB;
  const $ = id => document.getElementById(id);
  const UI = CB.UI = { selected: null, selVehicle: null, selStop: null, overlay: null, panel: null, lastSpeed: 1, follow: false };

  // ---------------- icons ----------------
  const IC = {
    street: '<path d="M8 3L5 21M16 3l3 18M12 4v3M12 10v3M12 16v3"/>',
    avenue: '<path d="M6 3L3 21M18 3l3 18M10 4v3M10 10v3M10 16v3M14 4v3M14 10v3M14 16v3"/>',
    highway: '<path d="M5 3L2 21M19 3l3 18M12 3v18M8 5v2M8 11v2M8 17v2M16 5v2M16 11v2M16 17v2"/>',
    rlow: '<path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5"/>',
    rmed: '<path d="M4 20V8h7v12M11 20V4h9v16M6 11h3M6 15h3M14 8h3M14 12h3M14 16h3"/>',
    rhigh: '<path d="M8 21V3h8v18M5 21h14M10 6h4M10 10h4M10 14h4"/>',
    clow: '<path d="M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9 20v-6h6v6"/>',

    ind: '<path d="M3 20V10l5 3V10l5 3V10l5 3V4h3v16zM3 20h18"/>',
    office: '<path d="M5 21V5l7-2 7 2v16M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/>',
    dezone: '<path d="M4 4h16v16H4zM4 4l16 16"/>',
    police: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',

  function junctionDiagram(cl) {
    const Wd = CB.World;
    const cx = 80, cy = 80, box = 26;
    let g = `<rect x="${cx - box}" y="${cy - box}" width="${box * 2}" height="${box * 2}" fill="#3c3f44"/>`;
    const st = cl.ctrl;
    for (let d = 0; d < 4; d++) {
      const aps = cl.aps.filter(a => a.d === (d + 2) % 4), exs = cl.exits.filter(e => e.d === d);
      if (!aps.length && !exs.length) continue;
      const fx = C.DX[d], fy = C.DY[d];
      const x0 = cx + fx * box, y0 = cy + fy * box;
      const w = 22;
      const rx = fx ? (fx > 0 ? x0 : x0 - 50) : cx - w, ry = fy ? (fy > 0 ? y0 : y0 - 50) : cy - w;
      g += `<rect x="${rx}" y="${ry}" width="${fx ? 50 : w * 2}" height="${fy ? 50 : w * 2}" fill="#4a4e55"/>`;
      // approach arrows
      for (const ap of aps) {
        const m = (cl.cfg.lanes[ap.key] || []).reduce((a, b) => a | b, 0);
        const lab = (m & 4 ? '↰' : '') + (m & 1 ? '↑' : '') + (m & 2 ? '↱' : '') + (m & 8 ? '↶' : '');
        const tx = cx + fx * (box + 30) + (fy ? -fy * 10 : 0), ty = cy + fy * (box + 30) + (fx ? fx * 10 : 0) + 5;
        const rot = [180, 270, 0, 90][d];
        g += `<text x="${tx}" y="${ty}" fill="#fff" font-size="13" text-anchor="middle" transform="rotate(${rot} ${tx} ${ty - 5})">${lab}</text>`;
        if (st === 'lights') g += `<circle cx="${cx + fx * (box + 6) + (fy ? -fy * 16 : 0)}" cy="${cy + fy * (box + 6) + (fx ? fx * 16 : 0)}" r="4" fill="#28e05a"/>`;
        if ((st === 'stop' || st === 'allstop') && CB.Traffic.isStopFor(cl, ap.key)) g += `<polygon points="${oct(cx + fx * (box + 6) + (fy ? -fy * 16 : 0), cy + fy * (box + 6) + (fx ? fx * 16 : 0), 5)}" fill="#c8231c"/>`;
      }
    }
    if (st === 'round') g += `<circle cx="${cx}" cy="${cy}" r="11" fill="#5d8c3c" stroke="#aeada6" stroke-width="2"/>`;
    return `<svg class="jdia" viewBox="0 0 160 160">${g}</svg>`;
  }
  function oct(x, y, r) { const p = []; for (let k = 0; k < 8; k++) { const a = Math.PI / 8 + k * Math.PI / 4; p.push((x + Math.cos(a) * r).toFixed(1) + ',' + (y + Math.sin(a) * r).toFixed(1)); } return p.join(' '); }

  UI.sfx = function (kind) {
    try {
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      const f = { build: 520, zone: 660, demolish: 180, click: 880 }[kind] || 600;
      o.type = kind === 'demolish' ? 'sawtooth' : 'triangle';
      o.frequency.setValueAtTime(f, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f * (kind === 'demolish' ? 0.5 : 1.5), actx.currentTime + 0.09);
      g.gain.setValueAtTime(0.045, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.14);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.15);
    } catch (e) { /* audio unavailable */ }

  function spark(cv, vals, col) {
    if (!cv) return;
    const g = cv.getContext('2d'), w = cv.width, h = cv.height;
    g.clearRect(0, 0, w, h);
    if (vals.length < 2) { g.fillStyle = '#93a4b4'; g.font = '22px Barlow, sans-serif'; g.fillText('Shown after the first month', 8, h / 2 + 6); return; }
    const mx = Math.max(...vals), mn = Math.min(0, ...vals), rg = mx - mn || 1;
    g.strokeStyle = 'rgba(160,190,215,0.15)'; g.lineWidth = 1;
    for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(0, h * k / 4); g.lineTo(w, h * k / 4); g.stroke(); }
    g.beginPath();
    vals.forEach((v, k) => { const x = k / (vals.length - 1) * (w - 8) + 4, y = h - 6 - (v - mn) / rg * (h - 14); k ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.strokeStyle = col; g.lineWidth = 3; g.stroke();
    g.lineTo(w - 4, h); g.lineTo(4, h); g.closePath(); g.fillStyle = col + '30'; g.fill();
    const lv = vals[vals.length - 1], ly = h - 6 - (lv - mn) / rg * (h - 14);
    g.fillStyle = col; g.beginPath(); g.arc(w - 4, ly, 5, 0, 7); g.fill();
  }

  let roadCache = { t: 0, set: new Set() };

      const el = $('dm_' + k); if (!el) continue;
      el.querySelector('i').style.height = Math.round(S.demand[k]) + '%';
      const off = (k === 'rmed' && !S.unlocked(C.ZONES[2].unlock)) || (k === 'rhigh' && !S.unlocked(C.ZONES[3].unlock)) || (k === 'off' && !S.unlocked(C.ZONES[7].unlock));
      el.classList.toggle('off', off);
    }
    const m = S.milestone, nx = C.MILESTONES[m + 1];
    if (nx) {
      const prev = C.MILESTONES[m].pop;
      $('mileFill').style.width = U.clamp((st.pop - prev) / (nx.pop - prev), 0, 1) * 100 + '%';
      $('mileText').textContent = C.MILESTONES[m].name + ' → ' + nx.name + ' at ' + nx.pop.toLocaleString();
    } else { $('mileFill').style.width = '100%'; $('mileText').textContent = C.MILESTONES[m].name; }
    while (S.notices.length) { const n = S.notices.shift(); UI.toast(n.text, n.kind); }
    const tip = $('tip'); const tt = CB.Tools.tip;
    tip.hidden = !tt; if (tt) tip.textContent = tt;
    // panels
    const ip = $('infoPanel');
    if (!ip.hidden) { if (UI.selected) updBuilding(ip, UI.selected); else if (UI.selVehicle) updVehicle(ip); else if (UI.selStop) sv(ip, 'wait', UI.selStop.waiting.reduce((a, q) => a + q.n, 0)); }
    const sp = $('sidePanel');
    if (!sp.hidden) {
      if (UI.panel === 'budget') updBudget(sp);
      else if (UI.panel === 'transit') updTransit(sp);
      else if (UI.panel === 'stats' && tick % 4 === 0) updStats(sp);
    }
    if (UI.overlay && tick % 4 === 0) refreshOverlay();
    if (tick % 2 === 0) updGoals();
    if (tick % 8 === 0 && UI.cat) {
      const cat = CATS.find(c => c.key === UI.cat);
      const locks = document.querySelectorAll('#palette .card.locked').length;
      const items = catItems(UI.cat, cat.tabs ? UI.tab[UI.cat] : null).filter(it => !S.unlocked(it.unlock)).length;
      if (locks !== items) renderPalette();
    }
    if (UI.junctionTile >= 0 && CB.World.jcl[UI.junctionTile] < 0) { $('infoPanel').hidden = true; UI.junctionTile = -1; }
  };
})();

<script>
'use strict';
// Open Skylines — boot, main loop, settings, save/load
(function () {
  const { C, U } = CB;
  const $ = id => document.getElementById(id);
  const Game = CB.Game = { running: false };

  function showErr(msg) {
    let e = $('err');
    if (!e) { e = document.createElement('div'); e.id = 'err'; document.body.appendChild(e); }
    e.textContent = msg;
  }
  window.addEventListener('error', ev => showErr('Error: ' + ev.message + (ev.filename ? '\n' + ev.filename.split('/').pop() + ':' + ev.lineno : '')));

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); return true; } catch (e) { return null; } }
  function storeDel(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }

  function defaultPreset() {
    const mobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    const cores = navigator.hardwareConcurrency || 4;
    if (mobile || cores <= 2) return 'low';
    return 'medium';
  }
  function loadSettings() {
    let s = null;
    try { s = JSON.parse(store(C.SET_KEY) || 'null'); } catch (e) { s = null; }
    const preset = (s && s.preset) || defaultPreset();
    const base = Object.assign({ preset, dayNight: true, fps: false }, C.QUALITY[preset === 'custom' ? 'medium' : preset]);
    return Object.assign(base, s || {});
  }
  Game.applySettings = function (ns) {
    const old = CB.Gfx.settings;
    CB.Gfx.applySettings(ns);
    if (old.cars !== ns.cars || old.shadows !== ns.shadows || old.detail !== ns.detail) CB.Meshes.resizeVehicles();
    if (old.trees !== ns.trees) CB.Meshes.treesDirty = true;
    store(C.SET_KEY, JSON.stringify(ns));
  };

  Game.save = function (quiet) {
    if (!Game.running) return false;
    try {
      localStorage.setItem(C.SAVE_KEY, JSON.stringify(CB.Sim.serialize()));
      return true;
    } catch (e) {
      if (!quiet) CB.UI.toast('Could not save: browser storage is blocked or full.', 'bad');
      return false;
    }
  };
  Game.autosave = function () { Game.save(true); };
  function readSave() { try { const s = store(C.SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

  Game.showStart = function (fresh) {
    if (fresh) {
      storeDel(C.SAVE_KEY);
      try { sessionStorage.setItem('openskylines.fresh', '1'); } catch (e) { /* ignore */ }
      location.reload();
    }
  };

  // ------------------------------------------------------------------
  function boot() {
    if (!window.THREE) { $('loading').textContent = 'Could not load the 3D engine. Check your internet connection and reload.'; return; }
    const save = readSave();
    const params = new URLSearchParams(location.search);
    let fresh = false;
    try { fresh = sessionStorage.getItem('openskylines.fresh') === '1'; sessionStorage.removeItem('openskylines.fresh'); } catch (e) { /* ignore */ }
    let seed = save && !fresh ? save.seed : Math.floor(Math.random() * 1e6) + 1;
    if (params.get('seed')) seed = +params.get('seed');
    if (params.get('trace')) console.log('seed ' + seed);
    const settings = loadSettings();
    if (params.get('preset')) Object.assign(settings, C.QUALITY[params.get('preset')], { preset: params.get('preset') });
    CB.World.init(seed);
    CB.Gfx.init($('view'), settings);
    CB.Meshes.init();
    CB.Sim.init({ seed, name: 'Port Alder' });
    CB.Tools.init($('view'));
    CB.UI.init();
    CB.Meshes.updateZoneTex(false);
    $('loading').remove();

    // start screen
    const st = $('start');
    st.hidden = false;
    $('topbar').hidden = true; $('toolbar').hidden = true;
    $('presetStart').value = settings.preset === 'custom' ? 'medium' : settings.preset;
    $('presetStart').onchange = () => {
      const p = $('presetStart').value;
      Game.applySettings(Object.assign({}, CB.Gfx.settings, C.QUALITY[p], { preset: p }));
    };
    if (save && !fresh) { $('btnContinue').hidden = false; $('btnContinue').textContent = 'Continue ' + save.name; }
    $('btnNew').onclick = () => startNew(($('cityInput').value || 'Port Alder').trim());
    $('btnContinue').onclick = () => continueSave(save);
    G0.orbit = true;
    requestAnimationFrame(loop);

    if (params.get('demo')) { startNew('Demo City'); demoCity(+params.get('ms') || 0); }
    if (params.get('play')) { startNew('Play Test'); playTest(); }
    if (params.get('autoload') && save) continueSave(save);
    if (params.get('ff')) fastForward(+params.get('ff'));
    if (params.get('autosave')) Game.save();
    if (params.get('cam')) { const c = CB.Gfx.cam; const v = params.get('cam').split(',').map(Number); c.tx = v[0]; c.tz = v[1]; c.tdist = c.dist = v[2]; c.yaw = v[3]; c.pitch = v[4]; }
    if (params.get('view')) { const c = CB.Gfx.cam; const v = params.get('view').split(',').map(Number); c.tdist = c.dist = v[0]; c.yaw = v[1]; c.pitch = v[2]; if (v.length > 3) { c.tx += v[3]; c.tz += v[4]; } }
    if (params.get('hour')) CB.Sim.hour = +params.get('hour');
    if (params.get('seed')) { /* seed is chosen at boot; see below */ }
    if (params.get('ov')) CB.UI.setOverlay(params.get('ov'));
    if (params.get('panel')) CB.UI.openPanel(params.get('panel'));
    if (params.get('cat')) CB.UI.openCat(params.get('cat'));
    if (params.get('sel')) { const z = +params.get('sel'); for (const b of CB.Sim.buildings.values()) if (b.zone === z && b.state === 'live') { CB.UI.select(b); break; } }
    if (params.get('dbg')) {
      const pre = document.createElement('pre'); pre.id = 'dbg'; pre.style.display = 'none'; document.body.appendChild(pre);
      const S = CB.Sim;
      const counts = {}; S.buildings.forEach(b => { const k = b.kind === 'svc' ? 'svc' : C.ZONES[b.zone].key + ':' + b.state; counts[k] = (counts[k] || 0) + 1; });
      pre.textContent = JSON.stringify({ month: S.month, hour: S.hour, money: Math.round(S.money), stats: S.stats, demand: S.demand, ms: S.milestone, last: S.last, veh: CB.Traffic.stats, nveh: CB.Traffic.vehicles.length, counts, riders: CB.Transit.stats,
        lines: CB.Transit.lines.map(l => ({ b: l.broken, n: l.stops.length, p: l.path && l.path.length, veh: CB.Transit.vehiclesOf(l).length, rm: l.ridersMonth })),
        rt: (() => { const s = CB.Transit.stops; if (s.length < 3) return null; const r = CB.Transit.route(s[0].tile, s[2].tile); return r ? { t: r.time, legs: r.legs } : 'null'; })(),
        wait: CB.Transit.stops.map(s => s.waiting.length), play: Game.playLog }, (k, v) => typeof v === 'number' ? Math.round(v * 100) / 100 : v);
    }
  }
  const G0 = { orbit: false };

  function startNew(name) {
    CB.Sim.name = name || 'Port Alder';
    $('start').hidden = true;
    $('topbar').hidden = false; $('toolbar').hidden = false;
    G0.orbit = false;
    Game.running = true;
    $('goals').hidden = false;
    CB.UI.setSpeed(1);
    const hw = CB.World.hwRow;
    CB.Gfx.focus((C.P0 + 18) * C.TILE, (hw + 1) * C.TILE, 260);
    CB.UI.toast('Welcome to ' + CB.Sim.name + '. Open Roads and drag a street from the little road at the end of the highway.', 'good');
    Game.save(true);
  }
  function continueSave(save) {
    try {
      CB.Sim.load(save);
      CB.Transit.buildAll();
      CB.Meshes.rebuildAll();
      CB.Meshes.updateZoneTex(false);
    } catch (e) { showErr('Could not load the saved city: ' + e.message); return; }
    $('start').hidden = true;
    $('topbar').hidden = false; $('toolbar').hidden = false;
    G0.orbit = false;
    Game.running = true;
    $('goals').hidden = false;
    CB.UI.setSpeed(1);
    // look at the city centre
    let sx = 0, sz = 0, n = 0;
    CB.Sim.buildings.forEach(b => { sx += b.x; sz += b.y; n++; });
    if (n) CB.Gfx.focus(sx / n * C.TILE, sz / n * C.TILE, 420);
  }

  // ------------------------------------------------------------------
  let last = performance.now(), fpsT = 0, fpsN = 0, iconT = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0.016;
    dt = Math.min(dt, 0.1);
    const S = CB.Sim, Gx = CB.Gfx, Mx = CB.Meshes;
    if (Game.running && S.speed > 0) {
      let simDt = dt * S.speed;
      const steps = Math.ceil(simDt / 0.1);
      const sd = simDt / steps;
      for (let k = 0; k < steps; k++) { S.step(sd); CB.Traffic.update(sd); CB.Transit.update(sd); }
    }
    if (G0.orbit) { Gx.cam.yaw += dt * 0.04; Gx.cam.tdist = 520; Gx.cam.pitch = 0.5; }
    Gx.uni.uTime.value += dt;
    Gx.setTime(S.hour);
    CB.Tools.update();
    if (CB.UI.follow && CB.UI.selVehicle) { const v = CB.UI.selVehicle; Gx.cam.tx += (v.x - Gx.cam.tx) * Math.min(1, dt * 5); Gx.cam.tz += (v.z - Gx.cam.tz) * Math.min(1, dt * 5); }
    Gx.updateCamera(dt);
    Mx.update(6);
    if (S.zoneTexDirty) { S.zoneTexDirty = false; Mx.updateZoneTex(CB.Tools.zoneView); }
    Mx.beginVehicles(); CB.Traffic.render(); CB.Transit.render(); Mx.endVehicles();
    iconT += dt;
    if (iconT > 0.5) { iconT = 0; Mx.setIcons(Game.running ? S.icons : []); }
    Gx.render();
    fpsN++; fpsT += dt;
    if (fpsT > 0.5) {
      const f = $('fps');
      f.textContent = Gx.settings.fps ? Math.round(fpsN / fpsT) + ' fps · ' + Gx.renderer.info.render.calls + ' draws · ' + (Gx.renderer.info.render.triangles / 1000).toFixed(0) + 'k tris' : '';
      fpsN = 0; fpsT = 0;
    }
  }

  // ------------------------------------------------------------------
  // Test helpers (URL params): ?demo=1 builds a starter town, ?ff=N runs N game hours
  function fastForward(hours) {
    const S = CB.Sim;
    const steps = Math.round(hours * C.SIM_SEC / 0.25);
    const trace = new URLSearchParams(location.search).get('trace');
    for (let k = 0; k < steps; k++) {
      if (trace) console.log('ff ' + k + ' S h=' + S.hour.toFixed(2));
      S.step(0.25);
      if (trace) console.log('ff ' + k + ' T veh=' + CB.Traffic.vehicles.length + ' q=' + CB.Traffic.queue.length);
      CB.Traffic.update(0.25);
      if (trace) console.log('ff ' + k + ' X');
      CB.Transit.update(0.25);
      if (k % 40 === 0) { if (trace) console.log('ff ' + k + ' M'); CB.Meshes.update(1); }
    }
  }
  function demoCity(ms) {
    const Wd = CB.World, S = CB.Sim, U2 = U, I = U.idx, Tl = CB.Tools;
    S.money = 900000;
    S.milestone = ms || 0;
    const r = Wd.hwRow, x0 = C.P0 + 16;
    const road = (rt, a, b) => { Tl._simulate({ type: 'road', rt }, a, b); };
    const AVE = C.ROADS.findIndex(q => q && q.key === 'ave4');
    const BIKE = C.ROADS.findIndex(q => q && q.key === 'bike2');
    // main avenue east from the connector
    road(ms >= 2 ? AVE : 1, I(x0, r + 1), I(x0 + 46, r + 1));
    for (let k = 0; k <= 6; k++) road(k % 2 && ms >= 1 ? BIKE : 1, I(x0 + 6 + k * 6, r - 20), I(x0 + 6 + k * 6, r + 21));
    for (let j = 0; j <= 7; j++) { const y = r - 20 + j * 6; if (Math.abs(y - r) <= 2) continue; road(1, I(x0 + 6, y), I(x0 + 42, y)); }
    if (ms >= 6) { for (let x = x0 + 4; x <= x0 + 46; x++) S.setRail(U2.idx(x, r - 7), 1); S.networkChanged(); }
    const X = CB.Transit;
    if (ms >= 3) {
      const ids = [[x0 + 12, r + 1], [x0 + 24, r + 1], [x0 + 36, r + 1], [x0 + 36, r - 8], [x0 + 24, r - 8], [x0 + 12, r - 8]].map(([x, y]) => (X.stopAtTile(I(x, y), 'bus') || X.addStop('bus', I(x, y))).id);
      X.createLine('bus', ids);
    }
    if (ms >= 6) { const ids = [x0 + 6, x0 + 25, x0 + 44].map(x => X.addStop('rail', I(x, r - 7)).id); X.createLine('rail', ids); X.setVehicles(X.lines[X.lines.length - 1], 2); }
    const place = (key, tx, ty) => {
      for (let rad = 0; rad < 12; rad++) for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
        const lot = S.serviceLot(key, tx + dx, ty + dy, 0);
        if (lot.ok) { S.placeService(key, lot); return true; }
      }
      return false;
    };
    if (ms >= 1) { place('clinic', x0 + 14, r - 3); place('garbage', x0 + 40, r + 15); place('park', x0 + 9, r - 9); place('playground', x0 + 27, r - 15); }
    if (ms >= 2) { place('fire', x0 + 26, r + 4); place('police', x0 + 32, r - 3); place('elem', x0 + 20, r - 9); }
    if (ms >= 3) place('plaza', x0 + 20, r + 5);
    if (ms >= 7) { place('claude', x0 + 33, r + 10); place('vscode', x0 + 14, r + 10); place('octocat', x0 + 38, r - 15); place('duck', x0 + 9, r - 15); }
    for (let i = 0; i < Wd.zone.length; i++) {
      if (!Wd.zonable[i] || Wd.bld[i]) continue;
      const x = U2.tx(i), y = U2.ty(i);
      if (x < x0 + 3 || x > x0 + 47 || Math.abs(y - r) > 22) continue;
      const dy = y - r;
      let z = 1;
      if (Math.abs(dy) <= 3) z = 4;
      else if (dy > 12) z = 6;
      else if (dy > 3 && x > x0 + 30) z = 4;
      else if (dy < -12 && ms >= 3) z = 2;
      if (ms >= 6 && Math.abs(dy) <= 8 && x < x0 + 20 && dy < 0) z = 3;
      if (ms >= 5 && dy > 3 && dy <= 8 && x < x0 + 18) z = 7;
      S.setZone(i, z);
    }
    S.zoneTexDirty = true;
    Tl.setTool(null);
    CB.Gfx.focus((x0 + 24) * C.TILE, r * C.TILE, 520);
  }
  // drives the real tools the way a player would
  function playTest() {
    const Wd = CB.World, Tl = CB.Tools, I = U.idx;
    const r = Wd.hwRow, x0 = C.P0 + 16;
    const log = [];
    const m0 = CB.Sim.money;
    Tl._simulate({ type: "road", rt: 1 }, I(x0, r + 1), I(x0 + 24, r + 1));            // main street east
    Tl._simulate({ type: 'road', rt: 1 }, I(x0 + 8, r - 10), I(x0 + 8, r + 10)); // cross street
    Tl._simulate({ type: 'road', rt: 1 }, I(x0 + 16, r - 10), I(x0 + 16, r + 10));
    Tl._simulate({ type: 'road', rt: 1 }, I(x0 + 8, r - 10), I(x0 + 16, r - 10));
    log.push('roads cost ' + Math.round(m0 - CB.Sim.money) + ', conn tiles ' + Wd.conn.reduce((a, b) => a + b, 0));
    Tl._simulate({ type: 'zone', z: 1 }, I(x0 + 1, r - 9), I(x0 + 15, r - 1));
    Tl._simulate({ type: 'zone', z: 4 }, I(x0 + 1, r + 1), I(x0 + 7, r + 3));
    Tl._simulate({ type: 'zone', z: 6 }, I(x0 + 17, r + 1), I(x0 + 24, r + 3));
    let zc = [0, 0, 0, 0, 0, 0, 0, 0]; for (let i = 0; i < Wd.zone.length; i++) zc[Wd.zone[i]]++;
    log.push('zones ' + zc.join(','));
    Tl._simulate({ type: 'svc', key: 'clinic' }, I(x0 + 11, r + 2), I(x0 + 11, r + 2));
    Tl._simulate({ type: 'bulldoze' }, I(x0 + 24, r), I(x0 + 24, r));
    log.push('buildings ' + CB.Sim.buildings.size + ', road at end ' + Wd.road[I(x0 + 24, r)]);
    Tl.setTool(null);
    Game.playLog = log;
  }
  Game.demoCity = demoCity;
  Game.fastForward = fastForward;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
