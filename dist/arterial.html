  }
  function clearPathRibbon() { if (UI.pathRibbon) { CB.Gfx.scene.remove(UI.pathRibbon); UI.pathRibbon.geometry.dispose(); UI.pathRibbon = null; } }
  function updVehicle(p) {
    const v = UI.selVehicle; if (!v) return;
    if (!CB.Traffic.vehicles.includes(v)) { sv(p, 'status', 'Arrived'); UI.follow = false; clearPathRibbon(); return; }
    const kmh = Math.round(v.speed / C.VEH_SPEED * 3.6);
    sv(p, 'status', v.dwell > 0 ? 'At a stop' : v.speed < 0.5 ? 'Waiting in traffic' : 'Driving');
    sv(p, 'spd', kmh + ' km/h');
    const rt = CB.World.road[v.cur];
    sv(p, 'road', rt ? C.ROADS[rt].name : '–');
    sv(p, 'lane', rt && C.ROADS[rt].lanes > 1 ? (v.laneIn === 0 ? 'Right lane' : 'Left lane') : 'Single lane');
    sv(p, 'trip', Math.round(CB.Traffic.time - v.born) + ' min');
    if (v.line) sv(p, 'pax', (v.load || 0) + ' / ' + C.TRANSIT.bus.cap);
  }
  UI.selectStop = function (s) {
    UI.select(null);
    UI.selStop = s;
    const p = $('infoPanel'); p.hidden = false;
    const lines = CB.Transit.lines.filter(l => l.stops.includes(s.id));
    p.innerHTML = head(s.name, s.type === 'bus' ? 'Bus stop' : (CB.World.rail[s.tile] === 2 ? 'Underground station' : 'Elevated station')) +
      `<div class="row"><span>Waiting passengers</span><b data-v="wait"></b></div>
       <div class="sec">${lines.length ? lines.map(l => `<div class="row"><span><span class="chip" style="background:${l.color}33;color:#fff">${l.name}</span></span><b>${l.vehicles} ${l.type === 'bus' ? 'buses' : 'trains'}</b></div>`).join('') : '<div class="sub">No line serves this stop yet.</div>'}</div>
       <div class="btns" style="margin-top:10px"><button class="btn danger" id="sdel">Remove stop</button></div>`;
    bindClose(p, () => { UI.selStop = null; p.hidden = true; });
    p.querySelector('#sdel').onclick = () => { CB.Transit.removeStop(s); UI.selStop = null; p.hidden = true; UI.refreshTransit(); };
    sv(p, 'wait', s.waiting.reduce((a, q) => a + q.n, 0));
  };

  const PROB = {
    noroad: ['No road access', 'Connect a road to the front of this building.'],
    noconn: ['Not connected to the highway', 'Residents and goods cannot reach this building. Connect its road to the rest of the city.'],
    garbage: ['Garbage is piling up', 'Build a Waste Transfer Station within range.'],
    workers: ['Not enough workers', 'More housing nearby, or better transit, will fill these jobs.'],
    customers: ['Not enough customers', 'Shops need residents nearby. Zone more housing or add transit.'],
    fire: ['On fire', 'A fire truck is needed. Build a Fire Station within range.'],
  };
  function renderBuilding(p, b) {
    const S = CB.Sim;
    if (b.kind === 'svc') {
      const s = C.SERVICES[b.svc];
      p.innerHTML = head(s.name, s.desc) +
        `<div class="row"><span>Upkeep</span><b>${U.money(s.upkeep)} / month</b></div>
         <div class="row"><span>Coverage radius</span><b>${s.radius * C.TILE} m</b></div>
         ${s.veh ? `<div class="row"><span>Vehicles out</span><b data-v="veh"></b></div>` : ''}
         <div data-v="sprob" class="sub"></div>
         <div class="btns" style="margin-top:10px"><button class="btn danger" id="bdel">Demolish</button></div>`;
    } else {
      const z = C.ZONES[b.zone], res = z.cat === 'res';
      p.innerHTML = head(b.name, z.name) +
        `<div class="row"><span>Level</span><b class="stars" data-v="stars"></b></div>
         <div data-v="chip"></div>
         <div class="sec">
         ${res ? `<div class="row"><span>Residents</span><b data-v="res"></b></div><div class="row"><span>Employed</span><b data-v="emp"></b></div><div class="row"><span>Average commute</span><b data-v="comm"></b></div>`
          : `<div class="row"><span>Workers</span><b data-v="wk"></b></div><div class="row"><span>From out of town</span><b data-v="out"></b></div>${z.cat === 'com' ? '<div class="row"><span>Customers</span>' + meter('cust') + '</div>' : ''}`}
         <div class="row"><span>Happiness</span>${meter('happy')}</div>
         <div class="row"><span>Land value</span>${meter('lv')}</div>
         <div class="row"><span>Level progress</span>${meter('prog')}</div>
         <div class="row"><span>Garbage</span>${meter('garb')}</div></div>
         <div class="sec"><div class="lbl">Services in range</div>
         ${[['police', 'Police'], ['fire', 'Fire'], ['health', 'Health'], ['edu', 'Education'], ['park', 'Parks'], ['transit', 'Transit']].map(k => `<div class="row"><span>${k[1]}</span>${meter('c_' + k[0])}</div>`).join('')}</div>
         <div class="btns" style="margin-top:10px"><button class="btn danger" id="bdel">Demolish</button></div>`;
    }
    bindClose(p, () => UI.select(null));
    p.querySelector('#bdel').onclick = () => { S.removeBuilding(b); UI.sfx('demolish'); UI.select(null); };
    updBuilding(p, b);
  }
  function updBuilding(p, b) {
    const S = CB.Sim, cv = S.cov, i = S.centerTile(b);
    if (!S.buildings.has(b.id)) { UI.select(null); return; }
    if (b.kind === 'svc') {
      const s = C.SERVICES[b.svc];
      if (s.veh) sv(p, 'veh', b.vehOut + ' / ' + s.vehCount);
      sv(p, 'sprob', b.prob === 'noroad' ? 'This building has no road access.' : '');
      return;
    }
    const z = C.ZONES[b.zone], res = z.cat === 'res';
    const stars = p.querySelector('[data-v="stars"]');
    if (stars && stars.dataset.l !== String(b.level)) { stars.dataset.l = b.level; stars.innerHTML = '★'.repeat(b.level) + '<span style="color:rgba(255,255,255,0.18)">' + '★'.repeat(5 - b.level) + '</span>'; }
    const chip = p.querySelector('[data-v="chip"]');
    let html;
    if (b.state === 'build') html = '<span class="chip warn">Under construction</span>';
    else if (b.state === 'aband') html = '<span class="chip bad">Abandoned: residents left because they were unhappy</span>';
    else if (b.state === 'fire') html = `<span class="chip bad">${PROB.fire[0]}</span><div class="sub" style="font-size:12px;margin-top:4px">${PROB.fire[1]}</div>`;
    else if (b.prob && PROB[b.prob]) html = `<span class="chip bad">${PROB[b.prob][0]}</span><div class="sub" style="font-size:12px;margin-top:4px">${PROB[b.prob][1]}</div>`;
    else if (b.level < 5 && cv.lv[i] < C.LV_REQ[b.level]) html = '<span class="chip warn">Land value too low to level up</span><div class="sub" style="font-size:12px;margin-top:4px">Parks, schools, health care and transit raise land value.</div>';
    else html = '<span class="chip good">Doing well</span>';
    if (chip.dataset.h !== html) { chip.innerHTML = html; chip.dataset.h = html; }
    if (res) {
      sv(p, 'res', b.res + ' / ' + b.cap + (z.perBuilding ? ' (1 household)' : ' (' + Math.max(1, Math.round(b.cap / 2.6)) + ' households)'));
      sv(p, 'emp', S.employedOf(b) + ' of ' + Math.round(b.res * 0.55) + ' workers');
      sv(p, 'comm', b.commute ? Math.round(b.commute) + ' min' : '–');
    } else {
      sv(p, 'wk', (b.filled + b.outside) + ' / ' + b.jobs);
      sv(p, 'out', b.outside);
      sm(p, 'cust', b.custRatio, goodCol(b.custRatio));
    }
    sm(p, 'happy', b.happy / 100, goodCol(b.happy / 100));
    sm(p, 'lv', cv.lv[i] / 80, goodCol(cv.lv[i] / 70));
    sm(p, 'prog', b.level >= 5 ? 1 : b.prog, 'var(--accent)');
    sm(p, 'garb', b.garbage / 150, b.garbage > 100 ? 'var(--bad)' : 'var(--mute)');
    for (const k of ['police', 'fire', 'health', 'edu', 'park', 'transit']) { const v = Math.min(1, cv[k][i]); sm(p, 'c_' + k, v, goodCol(v)); }
  }

  // ---------------- goals ----------------
  const GOALS = [
    ['Draw a road off the highway', () => countRoads() > 3],
    ['Zone low density housing beside your road', () => hasZone(1)],
    ['Zone some commercial and industry', () => hasZone(4) && hasZone(6)],
    ['Reach 60 residents', () => CB.Sim.stats.pop >= 60],
    ['Build a Medical Clinic and a Fire Station', () => hasSvc('clinic') && hasSvc('fire')],
    ['Add a Police Station and a Waste Transfer Station', () => hasSvc('police') && hasSvc('garbage')],
    ['Build an Elementary School', () => hasSvc('elem')],
    ['Grow to a Village (250 residents)', () => CB.Sim.milestone >= 1],
    ['Create a bus line with 3 or more stops', () => CB.Transit.lines.some(l => l.type === 'bus' && l.stops.length >= 3)],
    ['Zone medium density housing', () => hasZone(2)],
    ['Grow to a Town (800 residents)', () => CB.Sim.milestone >= 2],
    ['Grow to a Small City (2,000 residents)', () => CB.Sim.milestone >= 3],
    ['Build a metro or train line', () => CB.Transit.lines.some(l => l.type === 'rail')],
    ['Grow to a City and zone high density housing', () => CB.Sim.milestone >= 4 && hasZone(3)],
    ['Reach Metropolis (15,000 residents)', () => CB.Sim.milestone >= 6],
  ];
  let zoneCache = { t: 0, set: new Set() };
  function hasZone(z) {
    const now = performance.now();
    if (now - zoneCache.t > 1500) { zoneCache.t = now; zoneCache.set = new Set(); const Z = CB.World.zone; for (let i = 0; i < Z.length; i++) if (Z[i]) zoneCache.set.add(Z[i]); }
    return zoneCache.set.has(z);
  }
  function hasSvc(k) { for (const b of CB.Sim.buildings.values()) if (b.svc === k) return true; return false; }
  function countRoads() { const Wd = CB.World; let n = 0; for (let i = 0; i < Wd.road.length; i++) if (Wd.road[i] && Wd.road[i] !== 3 && Wd.conn[i]) { n++; if (n > 3) break; } return n; }
  function updGoals() {
    const g = $('goals');
    let done = 0; const st = GOALS.map(q => { const d = q[1](); return d; });
    let first = st.findIndex(d => !d); if (first < 0) first = GOALS.length;
    const from = Math.max(0, first - 1), to = Math.min(GOALS.length, first + 3);
    const html = `<h4><span>City goals · ${first}/${GOALS.length}</span><button id="gtog" aria-label="Toggle goals">${UI.goalsOpen ? '−' : '+'}</button></h4>` +
      (UI.goalsOpen ? `<ol start="${from + 1}">${GOALS.slice(from, to).map((q, k) => `<li class="${st[from + k] ? 'done' : (from + k === first ? 'cur' : '')}">${q[0]}</li>`).join('')}</ol>` : '');
    if (g.dataset.h !== html) { g.innerHTML = html; g.dataset.h = html; g.querySelector('#gtog').onclick = () => { UI.goalsOpen = !UI.goalsOpen; g.dataset.h = ''; updGoals(); }; }
  }

  // ---------------- periodic update ----------------
  let tick = 0;
  UI.update = function () {
    if (!CB.Game || !CB.Game.running) return;
    tick++;
    const S = CB.Sim, st = S.stats;
    $('cityName').textContent = S.name;
    $('money').textContent = U.money(S.money);
    $('money').className = 'num' + (S.money < 0 ? ' neg' : '');
    const pr = S.projected();
    const net = $('net'); net.textContent = (pr.net >= 0 ? '+' : '') + U.money(pr.net) + ' / month'; net.className = 'num ' + (pr.net >= 0 ? 'pos' : 'neg');
    $('pop').textContent = U.num(st.pop);
    $('popsub').textContent = U.num(st.filled + st.outsideIn) + ' jobs filled';
    $('happy').textContent = st.pop ? Math.round(st.happy) + '%' : '–';
    $('happysub').textContent = !st.pop ? '' : st.happy > 70 ? 'Delighted' : st.happy > 55 ? 'Content' : st.happy > 40 ? 'Uneasy' : 'Unhappy';
    const hh = Math.floor(S.hour), mm = Math.floor((S.hour - hh) * 60);
    $('time').textContent = String(hh).padStart(2, '0') + ':' + String(Math.floor(mm / 15) * 15).padStart(2, '0');
    $('date').textContent = S.dateStr();
    for (const k in S.demand) {
      const el = $('dm_' + k); if (!el) continue;
      el.querySelector('i').style.height = Math.round(S.demand[k]) + '%';
      const off = (k === 'rmed' && !S.unlocked(1)) || (k === 'rhigh' && !S.unlocked(4)) || (k === 'off' && !S.unlocked(3));
      el.classList.toggle('off', off);
    }
    const m = S.milestone, nx = C.MILESTONES[m + 1];
    if (nx) {
      const prev = C.MILESTONES[m].pop;
      $('mileFill').style.width = U.clamp((st.pop - prev) / (nx.pop - prev), 0, 1) * 100 + '%';
      $('mileText').textContent = C.MILESTONES[m].name + ' → ' + nx.name + ' at ' + nx.pop.toLocaleString();
    } else { $('mileFill').style.width = '100%'; $('mileText').textContent = C.MILESTONES[m].name; }
    while (S.notices.length) { const n = S.notices.shift(); UI.toast(n.text, n.kind); }
    const tip = $('tip'); const tt = CB.Tools.tip;
    tip.hidden = !tt; if (tt) tip.textContent = tt;
    // panels
    const ip = $('infoPanel');
    if (!ip.hidden) { if (UI.selected) updBuilding(ip, UI.selected); else if (UI.selVehicle) updVehicle(ip); else if (UI.selStop) sv(ip, 'wait', UI.selStop.waiting.reduce((a, q) => a + q.n, 0)); }
    const sp = $('sidePanel');
    if (!sp.hidden) {
      if (UI.panel === 'budget') updBudget(sp);
      else if (UI.panel === 'transit') updTransit(sp);
      else if (UI.panel === 'stats' && tick % 4 === 0) updStats(sp);
    }
    if (UI.overlay && tick % 4 === 0) refreshOverlay();
    if (tick % 2 === 0) updGoals();
    if (tick % 8 === 0 && UI.cat) {
      // refresh lock states after milestones
      const locks = document.querySelectorAll('#palette .card.locked').length;
      const items = catItems(UI.cat).filter(it => !S.unlocked(it.unlock)).length;
      if (locks !== items) renderPalette();
    }
  };
})();

</script>
<script>
'use strict';
// Arterial — boot, main loop, settings, save/load
(function () {
  const { C, U } = CB;
  const $ = id => document.getElementById(id);
  const Game = CB.Game = { running: false };

  function showErr(msg) {
    let e = $('err');
    if (!e) { e = document.createElement('div'); e.id = 'err'; document.body.appendChild(e); }
    e.textContent = msg;
  }
  window.addEventListener('error', ev => showErr('Error: ' + ev.message + (ev.filename ? '\n' + ev.filename.split('/').pop() + ':' + ev.lineno : '')));

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); return true; } catch (e) { return null; } }
  function storeDel(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }

  function defaultPreset() {
    const mobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    const cores = navigator.hardwareConcurrency || 4;
    if (mobile || cores <= 2) return 'low';
    return 'medium';
  }
  function loadSettings() {
    let s = null;
    try { s = JSON.parse(store(C.SET_KEY) || 'null'); } catch (e) { s = null; }
    const preset = (s && s.preset) || defaultPreset();
    const base = Object.assign({ preset, dayNight: true, fps: false }, C.QUALITY[preset === 'custom' ? 'medium' : preset]);
    return Object.assign(base, s || {});
  }
  Game.applySettings = function (ns) {
    const old = CB.Gfx.settings;
    CB.Gfx.applySettings(ns);
    if (old.cars !== ns.cars || old.shadows !== ns.shadows) CB.Meshes.resizeVehicles();
    if (old.trees !== ns.trees) CB.Meshes.treesDirty = true;
    store(C.SET_KEY, JSON.stringify(ns));
  };

  Game.save = function (quiet) {
    if (!Game.running) return false;
    try {
      localStorage.setItem(C.SAVE_KEY, JSON.stringify(CB.Sim.serialize()));
      return true;
    } catch (e) {
      if (!quiet) CB.UI.toast('Could not save: browser storage is blocked or full.', 'bad');
      return false;
    }
  };
  Game.autosave = function () { Game.save(true); };
  function readSave() { try { const s = store(C.SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

  Game.showStart = function (fresh) {
    if (fresh) {
      storeDel(C.SAVE_KEY);
      try { sessionStorage.setItem('arterial.fresh', '1'); } catch (e) { /* ignore */ }
      location.reload();
    }
  };

  // ------------------------------------------------------------------
  function boot() {
    if (!window.THREE) { $('loading').textContent = 'Could not load the 3D engine. Check your internet connection and reload.'; return; }
    const save = readSave();
    const params = new URLSearchParams(location.search);
    let fresh = false;
    try { fresh = sessionStorage.getItem('arterial.fresh') === '1'; sessionStorage.removeItem('arterial.fresh'); } catch (e) { /* ignore */ }
    let seed = save && !fresh ? save.seed : Math.floor(Math.random() * 1e6) + 1;
    if (params.get('seed')) seed = +params.get('seed');
    if (params.get('trace')) console.log('seed ' + seed);
    const settings = loadSettings();
    if (params.get('preset')) Object.assign(settings, C.QUALITY[params.get('preset')], { preset: params.get('preset') });
    CB.World.init(seed);
    CB.Gfx.init($('view'), settings);
    CB.Meshes.init();
    CB.Sim.init({ seed, name: 'Port Alder' });
    CB.Tools.init($('view'));
    CB.UI.init();
    CB.Meshes.updateZoneTex(false);
    $('loading').remove();

    // start screen
    const st = $('start');
    st.hidden = false;
    $('topbar').hidden = true; $('toolbar').hidden = true;
    $('presetStart').value = settings.preset === 'custom' ? 'medium' : settings.preset;
    $('presetStart').onchange = () => {
      const p = $('presetStart').value;
      Game.applySettings(Object.assign({}, CB.Gfx.settings, C.QUALITY[p], { preset: p }));
    };
    if (save && !fresh) { $('btnContinue').hidden = false; $('btnContinue').textContent = 'Continue ' + save.name; }
    $('btnNew').onclick = () => startNew(($('cityInput').value || 'Port Alder').trim());
    $('btnContinue').onclick = () => continueSave(save);
    G0.orbit = true;
    requestAnimationFrame(loop);

    if (params.get('demo')) { startNew('Demo City'); demoCity(+params.get('ms') || 0); }
    if (params.get('play')) { startNew('Play Test'); playTest(); }
    if (params.get('autoload') && save) continueSave(save);
    if (params.get('ff')) fastForward(+params.get('ff'));
    if (params.get('autosave')) Game.save();
    if (params.get('cam')) { const c = CB.Gfx.cam; const v = params.get('cam').split(',').map(Number); c.tx = v[0]; c.tz = v[1]; c.tdist = c.dist = v[2]; c.yaw = v[3]; c.pitch = v[4]; }
    if (params.get('view')) { const c = CB.Gfx.cam; const v = params.get('view').split(',').map(Number); c.tdist = c.dist = v[0]; c.yaw = v[1]; c.pitch = v[2]; if (v.length > 3) { c.tx += v[3]; c.tz += v[4]; } }
    if (params.get('hour')) CB.Sim.hour = +params.get('hour');
    if (params.get('seed')) { /* seed is chosen at boot; see below */ }
    if (params.get('ov')) CB.UI.setOverlay(params.get('ov'));
    if (params.get('panel')) CB.UI.openPanel(params.get('panel'));
    if (params.get('cat')) CB.UI.openCat(params.get('cat'));
    if (params.get('sel')) { const z = +params.get('sel'); for (const b of CB.Sim.buildings.values()) if (b.zone === z && b.state === 'live') { CB.UI.select(b); break; } }
    if (params.get('dbg')) {
      const pre = document.createElement('pre'); pre.id = 'dbg'; pre.style.display = 'none'; document.body.appendChild(pre);
      const S = CB.Sim;
      const counts = {}; S.buildings.forEach(b => { const k = b.kind === 'svc' ? 'svc' : C.ZONES[b.zone].key + ':' + b.state; counts[k] = (counts[k] || 0) + 1; });
      pre.textContent = JSON.stringify({ month: S.month, hour: S.hour, money: Math.round(S.money), stats: S.stats, demand: S.demand, ms: S.milestone, last: S.last, veh: CB.Traffic.stats, nveh: CB.Traffic.vehicles.length, counts, riders: CB.Transit.stats,
        lines: CB.Transit.lines.map(l => ({ b: l.broken, n: l.stops.length, p: l.path && l.path.length, veh: CB.Transit.vehiclesOf(l).length, rm: l.ridersMonth })),
        rt: (() => { const s = CB.Transit.stops; if (s.length < 3) return null; const r = CB.Transit.route(s[0].tile, s[2].tile); return r ? { t: r.time, legs: r.legs } : 'null'; })(),
        wait: CB.Transit.stops.map(s => s.waiting.length), play: Game.playLog }, (k, v) => typeof v === 'number' ? Math.round(v * 100) / 100 : v);
    }
  }
  const G0 = { orbit: false };

  function startNew(name) {
    CB.Sim.name = name || 'Port Alder';
    $('start').hidden = true;
    $('topbar').hidden = false; $('toolbar').hidden = false;
    G0.orbit = false;
    Game.running = true;
    $('goals').hidden = false;
    CB.UI.setSpeed(1);
    const hw = CB.World.hwRow;
    CB.Gfx.focus((C.P0 + 18) * C.TILE, (hw + 0.5) * C.TILE, 300);
    CB.UI.toast('Welcome to ' + CB.Sim.name + '. Open Roads and drag from the end of the highway to start your city.', 'good');
    Game.save(true);
  }
  function continueSave(save) {
    try {
      CB.Sim.load(save);
      CB.Transit.buildAll();
      CB.Meshes.rebuildAll();
      CB.Meshes.updateZoneTex(false);
    } catch (e) { showErr('Could not load the saved city: ' + e.message); return; }
    $('start').hidden = true;
    $('topbar').hidden = false; $('toolbar').hidden = false;
    G0.orbit = false;
    Game.running = true;
    $('goals').hidden = false;
    CB.UI.setSpeed(1);
    // look at the city centre
    let sx = 0, sz = 0, n = 0;
    CB.Sim.buildings.forEach(b => { sx += b.x; sz += b.y; n++; });
    if (n) CB.Gfx.focus(sx / n * C.TILE, sz / n * C.TILE, 420);
  }

  // ------------------------------------------------------------------
  let last = performance.now(), fpsT = 0, fpsN = 0, iconT = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0.016;
    dt = Math.min(dt, 0.1);
    const S = CB.Sim, Gx = CB.Gfx, Mx = CB.Meshes;
    if (Game.running && S.speed > 0) {
      let simDt = dt * S.speed;
      const steps = Math.ceil(simDt / 0.1);
      const sd = simDt / steps;
      for (let k = 0; k < steps; k++) { S.step(sd); CB.Traffic.update(sd); CB.Transit.update(sd); }
    }
    if (G0.orbit) { Gx.cam.yaw += dt * 0.04; Gx.cam.tdist = 520; Gx.cam.pitch = 0.5; }
    Gx.uni.uTime.value += dt;
    Gx.setTime(S.hour);
    CB.Tools.update();
    if (CB.UI.follow && CB.UI.selVehicle) { const v = CB.UI.selVehicle; Gx.cam.tx += (v.x - Gx.cam.tx) * Math.min(1, dt * 5); Gx.cam.tz += (v.z - Gx.cam.tz) * Math.min(1, dt * 5); }
    Gx.updateCamera(dt);
    Mx.update(6);
    if (S.zoneTexDirty) { S.zoneTexDirty = false; Mx.updateZoneTex(CB.Tools.zoneView); }
    Mx.beginVehicles(); CB.Traffic.render(); CB.Transit.render(); Mx.endVehicles();
    iconT += dt;
    if (iconT > 0.5) { iconT = 0; Mx.setIcons(Game.running ? S.icons : []); }
    Gx.render();
    fpsN++; fpsT += dt;
    if (fpsT > 0.5) {
      const f = $('fps');
      f.textContent = Gx.settings.fps ? Math.round(fpsN / fpsT) + ' fps · ' + Gx.renderer.info.render.calls + ' draws · ' + (Gx.renderer.info.render.triangles / 1000).toFixed(0) + 'k tris' : '';
      fpsN = 0; fpsT = 0;
    }
  }

  // ------------------------------------------------------------------
  // Test helpers (URL params): ?demo=1 builds a starter town, ?ff=N runs N game hours
  function fastForward(hours) {
    const S = CB.Sim;
    const steps = Math.round(hours * C.HOUR_SEC / 0.25);
    const trace = new URLSearchParams(location.search).get('trace');
    for (let k = 0; k < steps; k++) {
      if (trace) console.log('ff ' + k + ' S h=' + S.hour.toFixed(2));
      S.step(0.25);
      if (trace) console.log('ff ' + k + ' T veh=' + CB.Traffic.vehicles.length + ' q=' + CB.Traffic.queue.length);
      CB.Traffic.update(0.25);
      if (trace) console.log('ff ' + k + ' X');
      CB.Transit.update(0.25);
      if (k % 40 === 0) { if (trace) console.log('ff ' + k + ' M'); CB.Meshes.update(1); }
    }
  }
  function demoCity(ms) {
    const Wd = CB.World, S = CB.Sim, U2 = U;
    S.money = 400000;
    S.milestone = ms || 0;
    const r = Wd.hwRow, x0 = C.P0 + 17;
    const rd = (x, y, t) => { if (U2.inPlay(x, y) && Wd.roadOK(U2.idx(x, y))) S.setRoad(U2.idx(x, y), t); };
    for (let x = x0; x <= x0 + 46; x++) rd(x, r, 2);
    for (let k = 0; k <= 7; k++) for (let y = r - 21; y <= r + 21; y++) rd(x0 + 4 + k * 6, y, 1);
    for (let j = 0; j <= 7; j++) { if (r - 21 + j * 6 === r) continue; for (let x = x0 + 4; x <= x0 + 46; x++) rd(x, r - 21 + j * 6, 1); }
    if (ms >= 3) { for (let x = x0 + 4; x <= x0 + 46; x++) S.setRail(U2.idx(x, r - 6), 1); }
    S.networkChanged();
    if (ms >= 1) {
      const X = CB.Transit;
      const ids = [[x0 + 8, r], [x0 + 22, r], [x0 + 34, r], [x0 + 34, r - 9], [x0 + 22, r - 9], [x0 + 8, r - 9]].map(([x, y]) => X.addStop('bus', U2.idx(x, y)).id);
      X.createLine('bus', ids);
      const ids2 = [[x0 + 10, r + 9], [x0 + 28, r + 9], [x0 + 28, r + 3], [x0 + 10, r + 3]].map(([x, y]) => X.addStop('bus', U2.idx(x, y)).id);
      X.createLine('bus', ids2);
    }
    if (ms >= 3) {
      const X = CB.Transit;
      const ids = [x0 + 6, x0 + 25, x0 + 44].map(x => X.addStop('rail', U2.idx(x, r - 6)).id);
      X.createLine('rail', ids);
      X.setVehicles(X.lines[X.lines.length - 1], 2);
    }
    const place = (key, tx, ty) => {
      for (let rad = 0; rad < 12; rad++) for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
        const lot = S.serviceLot(key, tx + dx, ty + dy, 0);
        if (lot.ok) { S.placeService(key, lot); return true; }
      }
      return false;
    };
    place('clinic', x0 + 14, r - 3); place('fire', x0 + 26, r + 3); place('police', x0 + 32, r - 3);
    place('elem', x0 + 20, r - 9); place('garbage', x0 + 40, r + 15); place('park', x0 + 8, r - 9); place('park', x0 + 26, r - 15);
    place('plaza', x0 + 20, r + 3);
    for (let i = 0; i < Wd.zone.length; i++) {
      if (!Wd.zonable[i] || Wd.bld[i]) continue;
      const x = U2.tx(i), y = U2.ty(i);
      if (x < x0 + 3 || x > x0 + 47 || Math.abs(y - r) > 22) continue;
      const dy = y - r;
      let z = 1;
      if (Math.abs(dy) <= 2) z = 4;
      else if (dy > 12) z = 6;
      else if (dy > 2 && x > x0 + 30) z = 4;
      else if (dy < -12 && ms >= 1) z = 2;
      if (ms >= 4 && Math.abs(dy) <= 8 && x < x0 + 20 && dy < 0) z = 3;
      if (ms >= 3 && dy > 2 && dy <= 8 && x < x0 + 18) z = 7;
      S.setZone(i, z);
    }
    S.zoneTexDirty = true;
    CB.Gfx.focus((x0 + 24) * C.TILE, r * C.TILE, 520);
  }
  // drives the real tools the way a player would
  function playTest() {
    const Wd = CB.World, Tl = CB.Tools, I = U.idx;
    const r = Wd.hwRow, x0 = C.P0 + 17;
    const log = [];
    const m0 = CB.Sim.money;
    Tl._simulate({ type: 'road', rt: 1 }, I(x0, r), I(x0 + 24, r));            // main street east
    Tl._simulate({ type: 'road', rt: 1 }, I(x0 + 8, r - 10), I(x0 + 8, r + 10)); // cross street
    Tl._simulate({ type: 'road', rt: 1 }, I(x0 + 16, r - 10), I(x0 + 16, r + 10));
    Tl._simulate({ type: 'road', rt: 1 }, I(x0 + 8, r - 10), I(x0 + 16, r - 10));
    log.push('roads cost ' + Math.round(m0 - CB.Sim.money) + ', conn tiles ' + Wd.conn.reduce((a, b) => a + b, 0));
    Tl._simulate({ type: 'zone', z: 1 }, I(x0 + 1, r - 9), I(x0 + 15, r - 1));
    Tl._simulate({ type: 'zone', z: 4 }, I(x0 + 1, r + 1), I(x0 + 7, r + 3));
    Tl._simulate({ type: 'zone', z: 6 }, I(x0 + 17, r + 1), I(x0 + 24, r + 3));
    let zc = [0, 0, 0, 0, 0, 0, 0, 0]; for (let i = 0; i < Wd.zone.length; i++) zc[Wd.zone[i]]++;
    log.push('zones ' + zc.join(','));
    Tl._simulate({ type: 'svc', key: 'clinic' }, I(x0 + 11, r + 2), I(x0 + 11, r + 2));
    Tl._simulate({ type: 'bulldoze' }, I(x0 + 24, r), I(x0 + 24, r));
    log.push('buildings ' + CB.Sim.buildings.size + ', road at end ' + Wd.road[I(x0 + 24, r)]);
    Tl.setTool(null);
    Game.playLog = log;
  }
  Game.demoCity = demoCity;
  Game.fastForward = fastForward;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
