        if (b.commute > 0) h += U.clamp((70 - b.commute) / 6, -14, 6);
        workers += wk; employed += emp;
        pop += b.res;
        eduSum += cv.edu[i] * b.res;
      } else {
        const fr = b.jobs ? (b.filled + b.outside) / b.jobs : 0;
        h = 42 + 10 * cv.police[i] + 6 * cv.fire[i] + 6 * cv.health[i] + fr * 22 - (tax - 10) * 2.2;
        if (z.cat === 'com') h += (b.custRatio - 0.6) * 30;
        if (z.cat === 'off') h += 10 * cv.edu[i] - 12 * Math.min(1, cv.pollution[i]);
        jobs += b.jobs; filled += b.filled; outsideIn += b.outside;
      }
      if (b.garbage > 100) h -= b.garbage > 200 ? 26 : 14;
      if (noConn) h -= 35;
      b.happy = U.clamp(b.happy + (U.clamp(h, 0, 100) - b.happy) * 0.25, 0, 100);
      if (res && b.res > 0) { happySum += b.happy * b.res; happyW += b.res; if (b.commute) { comm += b.commute; commN++; } }
      if (b.state === 'aband') {
        b.abandT++;
        if (b.abandT > 120) { toRemove.push(b); return; }
        if (b.happy > 45 && !noConn) { b.state = 'live'; b.abandT = 0; b.low = 0; CB.Meshes.refreshBuilding(b); }
        icons.push(iconFor(b, 'aband'));
        return;
      }
      // occupancy
      if (res) {
        if (!noConn && b.res < b.cap && resDemand > 5 && b.happy > 30) b.res = Math.min(b.cap, b.res + Math.max(1, Math.ceil((b.cap - b.res) * 0.25)));
        if (b.happy < 28 && b.res > 0 && S.rng() < 0.35) b.res = Math.max(0, b.res - Math.max(1, Math.ceil(b.res * 0.12)));
        const wk = Math.round(b.res * 0.55);
        let e = employedOf(b);
        while (e > wk && b.work.length) {
          const w = b.work[b.work.length - 1]; const o = S.buildings.get(w.id);
          const k = Math.min(w.n, e - wk); w.n -= k; e -= k; if (o) o.filled = Math.max(0, o.filled - k);
          if (w.n <= 0) b.work.pop();
        }
      } else {
        // outside commuters fill jobs when locals are lacking
        if (b.outside > 0 && b.filled + b.outside > b.jobs) b.outside = Math.max(0, b.jobs - b.filled);
      }
      // level up
      const lvReq = C.LV_REQ[b.level] || 999;
      const full = res ? b.res >= b.cap * 0.85 : (b.filled + b.outside) >= b.jobs * 0.7;
      if (b.level < 5 && b.happy > 55 && cv.lv[i] >= lvReq && full && !noConn) {
        b.prog += (b.happy - 45) / 100 * 0.12;
        if (b.prog >= 1) {
          b.prog = 0; b.level++;
          const old = b.cap; b.cap = S.capOf(b);
          if (!res) b.jobs = b.cap;
          CB.Meshes.refreshBuilding(b);
          if (CB.UI && CB.UI.selected === b) CB.Meshes.setSelection(b);
        }
      }
      // decline
      const failing = b.happy < 22 || (!res && b.age > 60 && (b.filled + b.outside) < b.jobs * 0.12);
      if (failing) b.low++; else b.low = Math.max(0, b.low - 2);
      if (b.low > 60) {
        b.state = 'aband'; b.abandT = 0;
        if (res) { releaseWork(b); b.res = 0; } else { S.buildings.forEach(o => { if (o.work.length) o.work = o.work.filter(w => w.id !== b.id); }); b.filled = 0; b.outside = 0; }
        CB.Meshes.refreshBuilding(b);
        return;
      }
      // problems
      if (noRoad) b.prob = 'noroad';
      else if (noConn) b.prob = 'noconn';
      else if (b.garbage > 100) b.prob = 'garbage';
      else if (!res && b.age > 36 && (b.filled + b.outside) < b.jobs * 0.3) b.prob = 'workers';
      else if (z.cat === 'com' && b.age > 48 && b.custRatio < 0.25) b.prob = 'customers';
      if (b.prob) icons.push(iconFor(b));
    });
    for (const b of toRemove) S.removeBuilding(b);
    const st = S.stats;
    st.pop = pop; st.workers = workers; st.employed = employed; st.jobs = jobs; st.filled = filled; st.outsideIn = outsideIn;
    st.happy = happyW ? happySum / happyW : 60;
    st.unemp = workers ? Math.max(0, 1 - employed / workers) : 0;
    st.edu = pop ? eduSum / pop : 0;
    st.commute = commN ? comm / commN : 0;
    st.buildingCount = S.buildings.size;
    S.icons = icons;
  }
  function iconFor(b, type) {
    const cx = (b.x + b.fw / 2) * T, cz = (b.y + b.fh / 2) * T;
    const h = b._h || (b._h = CB.Meshes.buildingHeight(b));
    return { x: cx, y: b.baseY + h + 4, z: cz, type: type || b.prob };
  }
  S.invalidateHeight = b => { b._h = 0; };

  // ------------------------------------------------------------------
  // Employment matching
  // ------------------------------------------------------------------
  function matchJobs() {
    const Wd = CB.World;
    const open = [];
    // locals can also take jobs currently held by out-of-town commuters
    S.buildings.forEach(b => { if (S.isWork(b) && b.state === 'live' && b.filled < b.jobs) open.push(b); });
    const res = [];
    S.buildings.forEach(b => { if (S.isRes(b) && b.state === 'live' && b.res > 0) res.push(b); });
    if (!res.length) return;
    let n = Math.min(res.length, 60);
    for (let k = 0; k < n && open.length; k++) {
      const b = res[(S.resRot++) % res.length];
      const wk = Math.round(b.res * 0.55);
      let emp = employedOf(b);
      if (emp >= wk || !Wd.conn[b.road]) continue;
      let best = null, bd = 1e9;
      for (let t = 0; t < 6; t++) {
        const o = open[Math.floor(S.rng() * open.length)];
        if (!Wd.conn[o.road]) continue;
        if (o.zone === 7 && S.rng() > S.cov.edu[S.centerTile(b)] * 0.85 + 0.15) continue;
        const d = U.dist(o.road, b.road) + S.rng() * 6;
        if (d < bd) { bd = d; best = o; }
      }
      if (!best) continue;
      // locals displace outside commuters
      const free = best.jobs - best.filled - best.outside + best.outside;
      const take = Math.min(wk - emp, free, 4);
      if (take <= 0) continue;
      const fromOutside = Math.max(0, best.filled + best.outside + take - best.jobs);
      best.outside = Math.max(0, best.outside - fromOutside);
      best.filled += take;
      const e = b.work.find(w => w.id === best.id);
      if (e) e.n += take; else b.work.push({ id: best.id, n: take });
      if (best.filled >= best.jobs) open.splice(open.indexOf(best), 1);
    }
    // commuters from outside when unemployment is low
    if (S.stats.unemp < 0.06) {
      for (const o of open.slice(0, 10)) {
        if (o.filled + o.outside >= o.jobs) continue;
        if (!Wd.conn[o.road]) continue;
        const maxOut = Math.ceil(o.jobs * 0.45);
        const add = Math.min(2, maxOut - o.outside, o.jobs - o.filled - o.outside);
        if (add > 0) o.outside += add;
      }
    }
  }

  // ------------------------------------------------------------------
  // Demand
  // ------------------------------------------------------------------
  function computeDemand() {
    const st = S.stats;
    let comJobs = 0, indJobs = 0, offJobs = 0, landmarks = 0;
    S.buildings.forEach(b => {
      if (b.kind === 'svc') { if (C.SERVICES[b.svc].cat === 'landmarks') landmarks++; return; }
      const cat = C.ZONES[b.zone].cat;
      const cap = b.state === 'build' ? S.capOf(b) : b.jobs;
      if (cat === 'com') comJobs += cap; else if (cat === 'ind') indJobs += cap; else if (cat === 'off') offJobs += cap;
    });
    let pending = 0;
    S.buildings.forEach(b => { if (S.isRes(b)) pending += b.state === 'build' ? S.capOf(b) : Math.max(0, b.cap - b.res); });
    const pop = st.pop;
    const workers = st.workers;
    const openJobs = Math.max(0, st.jobs - st.filled - st.outsideIn);
    // residential: base attractiveness + open jobs + happiness - taxes - unemployment
    let rd = 46 + 34 * U.clamp((openJobs - pending * 0.3) / Math.max(15, workers * 0.2), -1, 1)
      + (st.happy - 55) * 0.8 - (S.tax.res - 10) * 4.5 - Math.max(0, st.unemp - 0.08) * 160
      - Math.max(0, pending - 30 - pop * 0.05) * 0.4;
    if (pop < 80) rd = Math.max(rd, 80 - pending * 0.5);
    rd = U.clamp(rd, 0, 100);
    S.resDemandBase = rd;
    const w = U.clamp(pop / 6000, 0, 1);
    S.demand.rlow = U.clamp(rd * (1.05 - 0.55 * w), 0, 100);
    S.demand.rmed = S.unlocked(1) ? U.clamp(rd * (0.6 + 0.5 * w) + (pop > 400 ? 8 : 0), 0, 100) : 0;
    S.demand.rhigh = S.unlocked(4) ? U.clamp(rd * (0.4 + 0.8 * w) + 10, 0, 100) : 0;
    // workplaces: what residents need + workers looking for jobs
    const avail = U.clamp((st.unemp - 0.03) * 400, 0, 60);
    const comNeed = pop * 0.16 + landmarks * 25 + 6;
    S.demand.com = U.clamp(22 + 60 * U.clamp((comNeed - comJobs) / Math.max(8, comNeed * 0.3), -1, 1) - (S.tax.com - 10) * 4.5 + avail, 0, 100);
    const indNeed = pop * 0.19 + comJobs * 0.2 + 10;
    S.demand.ind = U.clamp(22 + 60 * U.clamp((indNeed - indJobs) / Math.max(8, indNeed * 0.3), -1, 1) - (S.tax.ind - 10) * 4.5 + avail, 0, 100);
    const offNeed = pop * 0.11 * (0.3 + st.edu);
    S.demand.off = S.unlocked(3) ? U.clamp(15 + 65 * U.clamp((offNeed - offJobs) / Math.max(8, offNeed * 0.3), -1, 1) - (S.tax.off - 10) * 4.5 + avail * 0.6, 0, 100) : 0;
  }
  S.zoneDemand = function (z) {
    const k = C.ZONES[z].key;
    if (k === 'rlow') return S.demand.rlow;
    if (k === 'rmed') return S.demand.rmed;
    if (k === 'rhigh') return S.demand.rhigh;
    if (k === 'clow' || k === 'chigh') return S.demand.com;
    if (k === 'ind') return S.demand.ind;
    return S.demand.off;
  };

  function growth() {
    if (S.lotsDirty) rebuildLots();
    let constructing = 0;
    S.buildings.forEach(b => { if (b.state === 'build') constructing++; });
    const maxCons = 6 + Math.floor(S.stats.pop / 50);
    for (let z = 1; z < C.ZONES.length; z++) {
      if (!S.unlocked(C.ZONES[z].unlock)) continue;
      const d = S.zoneDemand(z);
      if (d < 6 || !S.lots[z] || !S.lots[z].length) continue;
      const tries = 1 + Math.floor(d / 20);
      for (let t = 0; t < tries && constructing < maxCons; t++) {
        if (S.rng() < d / 100 * 0.95) { if (tryGrow(z)) constructing++; }
      }
    }
  }

  // ------------------------------------------------------------------
  // Fires & service vehicles
  // ------------------------------------------------------------------
  function svcInRange(b, cov, needVeh) {
    let best = null, bd = 1e9;
    S.buildings.forEach(s => {
      if (s.kind !== 'svc') return;
      const sv = C.SERVICES[s.svc];
      if (sv.cov !== cov) return;
      if (needVeh && s.vehOut >= (sv.vehCount || 0)) return;
      const d = Math.hypot(s.x + s.fw / 2 - b.x - b.fw / 2, s.y + s.fh / 2 - b.y - b.fh / 2);
      if (d <= sv.radius && d < bd && CB.World.road[s.road]) { bd = d; best = s; }
    });
    return best;
  }
  function startFire(b) {
    b.state = 'fire'; b.fire = 0;
    const st = svcInRange(b, 'fire', true);
    if (!st) return;
    st.vehOut++;
    const back = () => {
      CB.Traffic.request({ from: b.road, to: st.road, kind: 'fire', onArrive: () => { st.vehOut = Math.max(0, st.vehOut - 1); }, onFail: () => { st.vehOut = Math.max(0, st.vehOut - 1); } });
    };
    CB.Traffic.request({
      from: st.road, to: b.road, kind: 'fire', purpose: 'Responding to a fire',
      onArrive: (v, ok) => {
        if (S.buildings.has(b.id) && b.state === 'fire') { b.state = 'live'; b.fire = 0; CB.Meshes.refreshBuilding(b); }
        back();
      },
      onFail: () => { st.vehOut = Math.max(0, st.vehOut - 1); if (b.state === 'fire') { b.state = 'live'; } },
    });
  }
  function dispatchServices() {
    const Wd = CB.World;
    const all = [];
    S.buildings.forEach(b => all.push(b));
    for (const s of all) {
      if (s.kind !== 'svc' || !Wd.road[s.road] || !Wd.conn[s.road]) continue;
      const sv = C.SERVICES[s.svc];
      if (!sv.veh || s.vehOut >= sv.vehCount) continue;
      const cx = s.x + s.fw / 2, cy = s.y + s.fh / 2;
      if (sv.cov === 'garbage') {
        let target = null, tg = 30;
        for (let k = 0; k < 40; k++) {
          const b = all[Math.floor(S.rng() * all.length)];
          if (b.kind !== 'zone' || b.gTarget || b.garbage < tg) continue;
          if (Math.hypot(b.x - cx, b.y - cy) > sv.radius) continue;
          target = b; tg = b.garbage;
        }
        if (!target) continue;
        target.gTarget = true; s.vehOut++;
        const collect = () => {
          const tx = target.x, ty = target.y;
          for (const o of all) if (o.kind === 'zone' && Math.abs(o.x - tx) <= 6 && Math.abs(o.y - ty) <= 6) o.garbage = 0;
          target.gTarget = false;
        };
        const done = () => { s.vehOut = Math.max(0, s.vehOut - 1); };
        CB.Traffic.request({
          from: s.road, to: target.road, kind: 'garbage', purpose: 'Collecting garbage',
          onArrive: (v, ok) => { if (ok) collect(); else target.gTarget = false; CB.Traffic.request({ from: target.road, to: s.road, kind: 'garbage', purpose: 'Returning to depot', onArrive: done, onFail: done }); },
          onFail: (why) => { if (why === 'cap') collect(); target.gTarget = false; done(); },
        });
      } else if ((sv.cov === 'police' || sv.cov === 'health') && S.rng() < (sv.cov === 'police' ? 0.55 : 0.3)) {
        const cands = all.filter(b => b.kind === 'zone' && b.state === 'live' && Math.hypot(b.x - cx, b.y - cy) <= sv.radius);
        if (!cands.length) continue;
        const target = U.pick(cands, S.rng);
        s.vehOut++;
        const done = () => { s.vehOut = Math.max(0, s.vehOut - 1); };
        CB.Traffic.request({
          from: s.road, to: target.road, kind: sv.veh, purpose: sv.cov === 'police' ? 'On patrol' : 'Medical call',
          onArrive: () => CB.Traffic.request({ from: target.road, to: s.road, kind: sv.veh, purpose: 'Returning to station', onArrive: done, onFail: done }),
          onFail: done,
        });
      }
    }
  }

  // ------------------------------------------------------------------
  // Trips (agents)
  // ------------------------------------------------------------------
  const gauss = (h, mu, s) => Math.exp(-0.5 * ((h - mu) / s) ** 2) / (s * 2.5066);
  function dayCurve(h) { return h < 6 || h > 22 ? 0.01 : (h < 9 || h > 19 ? 0.05 : 0.075); }
  function carColor() { return U.pick(CB.Meshes.CAR_COLORS, S.rng); }
  function randomOf(list) { return list.length ? list[Math.floor(S.rng() * list.length)] : null; }

  let resList = [], comList = [], indList = [], workList = [], visitList = [];
  function refreshLists() {
    resList = []; comList = []; indList = []; workList = []; visitList = [];
    S.buildings.forEach(b => {
      if (b.state !== 'live' || !CB.World.conn[b.road]) return;
      if (b.kind === 'svc') { const c = C.SERVICES[b.svc].cat; if (c === 'landmarks' || (c === 'parks' && b.w > 1)) visitList.push(b); return; }
      const cat = C.ZONES[b.zone].cat;
      if (cat === 'res') { if (b.res > 0) resList.push(b); }
      else { workList.push(b); if (cat === 'com') { comList.push(b); visitList.push(b); } if (cat === 'ind') indList.push(b); }
    });
  }

  function carTrip(from, to, purpose, n, onArrive, kind) {
    CB.Traffic.request({
      from, to, kind: kind || (S.rng() < 0.3 ? 'suv' : 'car'), col: kind === 'truck' || kind === 'van' ? null : carColor(), purpose,
      onArrive: (v, ok) => onArrive && onArrive(ok ? CB.Traffic.time - v.born : 120, ok),
      onFail: (why) => { if (why === 'cap' && onArrive) onArrive(U.dist(from, to) * T / 16 + 10, true); },
    });
  }
  function personTrip(fromTile, toTile, purpose, n, done, carFree) {
    // mode choice: car time + parking/fuel cost vs transit time (CS2: time, comfort, money)
    const dist = U.dist(fromTile, toTile);
    const carT = dist * T / (13 * C.VEH_SPEED) * (1 + 1.8 * (1 - CB.Traffic.stats.flow)) + 14;
    const r = CB.Transit.route(fromTile, toTile);
    if (r) {
      const p = 1 / (1 + Math.exp((r.time - carT * 1.3) / 10));
      if (S.rng() < Math.max(p * 0.9 + 0.05, carFree || 0)) {
        S.stats.transitShare += (1 - S.stats.transitShare) * 0.01;
        CB.Transit.addPassenger(r, n, () => done && done(CB.Traffic.time - r._t0, true));
        r._t0 = CB.Traffic.time;
        return;
      }
    }
    S.stats.transitShare *= 0.99;
    carTrip(fromTile, toTile, purpose, n, done);
  }
  // share of households without a car (they ride transit whenever a route exists)
  const CAR_FREE = [0, 0.08, 0.22, 0.32];
  function recordCommute(b) {
    return (t, ok) => {
      if (!S.buildings.has(b.id)) return;
      const v = ok ? t : 150;
      b.commute = b.commute ? b.commute * 0.8 + v * 0.2 : v;
    };
  }

  function generateTrips(dtH) {
    if (!resList.length && !workList.length) return;
    const h = S.hour, st = S.stats, A = S.acc;
    const cars = CB.Gfx.settings.cars;
    const ppc = Math.max(1, st.employed / (cars * 0.85));
    const toWork = gauss(h, 7.6, 1.2), toHome = gauss(h, 17.3, 1.4);
    A.work += st.employed * toWork * dtH / ppc;
    A.home += st.employed * toHome * dtH / ppc;
    A.shop += st.pop * 0.25 * dayCurve(h) * dtH / ppc;
    let indF = 0; for (const b of indList) indF += b.filled + b.outside;
    A.freight += indF * 0.35 * dayCurve(h) * dtH / Math.max(1, ppc * 0.7) + comList.length * 0.15 * dayCurve(h) * dtH;
    A.visit += (st.pop * 0.02 + visitList.length * 3) * dayCurve(h) * dtH / ppc;
    A.cin += st.outsideIn * toWork * dtH / ppc;
    A.cout += st.outsideIn * toHome * dtH / ppc;
    const out = CB.World.outside[0];
    let guard = 0;
    while (A.work >= 1 && guard++ < 30) {
      A.work--;
      const b = randomOf(resList); if (!b || !b.work.length) continue;
      const w = S.buildings.get(U.pick(b.work, S.rng).id); if (!w) continue;
      personTrip(b.road, w.road, 'Commuting to work', ppc, recordCommute(b), CAR_FREE[b.zone]);
    }
    while (A.home >= 1 && guard++ < 60) {
      A.home--;
      const b = randomOf(resList); if (!b || !b.work.length) continue;
      const w = S.buildings.get(U.pick(b.work, S.rng).id); if (!w) continue;
      personTrip(w.road, b.road, 'Heading home', ppc, recordCommute(b), CAR_FREE[b.zone]);
    }
    while (A.shop >= 1 && guard++ < 90) {
      A.shop--;
      const b = randomOf(resList); if (!b || !comList.length) continue;
      let best = null, bd = 1e9;
      for (let k = 0; k < 5; k++) { const c = randomOf(comList); const d = U.dist(c.road, b.road) + S.rng() * 8; if (d < bd) { bd = d; best = c; } }
      if (!best) continue;
      const shop = best;
      personTrip(b.road, shop.road, 'Going shopping', ppc, () => { if (S.buildings.has(shop.id)) shop.cust += ppc; }, CAR_FREE[b.zone]);
    }
    while (A.freight >= 1 && guard++ < 110) {
      A.freight--;
      const src = indList.length && S.rng() < 0.7 ? randomOf(indList) : null;
      if (src) {
        const dst = comList.length && S.rng() < 0.65 ? randomOf(comList) : null;
        if (dst) carTrip(src.road, dst.road, 'Delivering goods', 1, null, 'truck');
        else if (out !== undefined) carTrip(src.road, out, 'Exporting goods', 1, null, 'truck');
      } else if (comList.length && out !== undefined) {
        carTrip(out, randomOf(comList).road, 'Importing goods', 1, null, 'truck');
      }
    }
    while (A.visit >= 1 && guard++ < 130) {
      A.visit--;
      const dst = randomOf(visitList); if (!dst || out === undefined) continue;
      const tgt = dst;
      carTrip(out, dst.road, 'Visiting the city', ppc, () => { if (S.buildings.has(tgt.id) && tgt.kind === 'zone') tgt.cust += ppc; });
    }
    while (A.cin >= 1 && guard++ < 150) {
      A.cin--;
      const w = randomOf(workList.filter ? workList : []); if (!w || !w.outside || out === undefined) continue;
      carTrip(out, w.road, 'Commuting from out of town', ppc, null);
    }
    while (A.cout >= 1 && guard++ < 170) {
      A.cout--;
      const w = randomOf(workList); if (!w || !w.outside || out === undefined) continue;
      carTrip(w.road, out, 'Leaving town', ppc, null);
    }
    for (const k in A) if (A[k] > 40) A[k] = 40;
  }

  function moveIn(b) {
    const out = CB.World.outside[0];
    if (out === undefined || !CB.World.conn[b.road]) return;
    const n = Math.ceil(b.cap * 0.5);
    CB.Traffic.request({
      from: out, to: b.road, kind: 'van', purpose: 'Moving in',
      onArrive: () => { if (S.buildings.has(b.id)) b.res = Math.min(b.cap, b.res + n); },
      onFail: () => { if (S.buildings.has(b.id)) b.res = Math.min(b.cap, b.res + n); },
    });
  }

  // ------------------------------------------------------------------
  // Economy
  // ------------------------------------------------------------------
  function hourlyEconomy() {
    const Wd = CB.World, B = S.budget;
    let res = 0, com = 0, ind = 0, off = 0, svc = 0;
    S.buildings.forEach(b => {
      if (b.kind === 'svc') { svc += C.SERVICES[b.svc].upkeep; return; }
      if (b.state !== 'live') return;
      const z = C.ZONES[b.zone], L = b.level - 1;
      if (z.cat === 'res') res += b.res * (3.0 + 0.5 * L);
      else {
        const wk = b.filled + b.outside;
        if (z.cat === 'com') com += wk * (3.4 + 0.5 * L) * (0.55 + 0.45 * Math.min(1.2, b.custRatio));
        else if (z.cat === 'ind') ind += wk * (3.2 + 0.4 * L);
        else off += wk * (4.4 + 0.6 * L);
      }
    });
    const inc = { res: res * S.tax.res / 10 / 24, com: com * S.tax.com / 10 / 24, ind: ind * S.tax.ind / 10 / 24, off: off * S.tax.off / 10 / 24 };
    let roads = 0;
    for (let i = 0; i < N; i++) {
      if (Wd.road[i] && U.inPlay(U.tx(i), U.ty(i))) roads += C.ROADS[Wd.road[i]].upkeep;
      if (Wd.rail[i]) roads += C.RAIL[Wd.rail[i]].upkeep;
    }
    let transit = 0;
    for (const l of CB.Transit.lines) transit += l.vehicles * C.TRANSIT[l.type].upkeep;
    let loans = 0; for (const l of S.loans) loans += l.payment;
    const exp = { services: svc / 24, roads: roads / 24, transit: transit / 24, utilities: S.stats.pop * 0.35 / 24, loans: loans / 24 };
    for (const k in inc) { B.inc[k] += inc[k]; S.money += inc[k]; }
    for (const k in exp) { B.exp[k] += exp[k]; S.money -= exp[k]; }
  }
  S.projected = function () {
    // monthly projection from last month, or this month's pace
    const src = S.month > 0 ? S.last : S.budget;
    let inc = 0, exp = 0;
    for (const k in src.inc) inc += src.inc[k];
    for (const k in src.exp) exp += src.exp[k];
    if (S.month === 0) { const f = 24 / Math.max(1, S.hour - 7 + 1); inc *= f; exp *= f; }
    return { inc, exp, net: inc - exp };
  };
  S.takeLoan = function (amt) {
    if (S.loans.length >= 3) return false;
    const months = 24;
    S.loans.push({ amount: amt, payment: Math.round(amt * 1.12 / months), left: months });
    S.money += amt;
    S.notify('Loan of ' + U.money(amt) + ' approved.', 'good');
    return true;
  };
  S.repayLoan = function (k) {
    const l = S.loans[k]; if (!l) return false;
    const owed = l.payment * l.left;
    if (S.money < owed) return false;
    S.money -= owed; S.loans.splice(k, 1); return true;
  };
  function monthly() {
    S.last = S.budget; S.budget = blankBudget();
    for (const l of S.loans) l.left--;
    S.loans = S.loans.filter(l => l.left > 0);
    S.buildings.forEach(b => {
      if (S.isWork(b) && C.ZONES[b.zone].cat === 'com') {
        const need = Math.max(1, b.jobs * 5);
        b.custRatio = U.clamp(b.custRatio * 0.4 + (b.cust / need) * 0.6, 0, 1.5);
        b.cust = 0;
      }
    });
    CB.Transit.monthly();
    S.history.push({ pop: S.stats.pop, money: Math.round(S.money) });
    if (S.history.length > 120) S.history.shift();
    if (CB.Game && CB.Game.autosave) CB.Game.autosave();
  }

  // citizen chatter (like CS2's Chirper), driven by real city conditions
  const FIRST = ['Maya', 'Theo', 'Priya', 'Jonas', 'Aiko', 'Luis', 'Noor', 'Sam', 'Ines', 'Kofi', 'Elena', 'Ravi', 'Hana', 'Oscar', 'Lena', 'Marco'];
  function chirp() {
    const st = S.stats, Tr = CB.Traffic;
    if (st.pop < 40) return;
    const opts = [];
    if (Tr.stats.flow < 0.55) opts.push('Stuck in traffic again. Somebody please build another road or a bus line.', 'Traffic is crawling. My commute takes forever.');
    if (st.unemp > 0.12) opts.push('Still looking for work. We need more shops and factories around here.');
    if (st.happy > 70) opts.push('Honestly, ' + S.name + ' is a lovely place to live.', 'Great services in this town. Feeling lucky.');
    if (S.stats.transitShare > 0.15) opts.push('Took the ' + (CB.Transit.lines.some(l => l.type === 'rail') ? 'metro' : 'bus') + ' today. Fast and cheap!');
    if (S.icons.some(i => i.type === 'garbage')) opts.push('The garbage on my street is starting to smell.');
    if (S.cov.health && st.pop > 150 && ![...S.buildings.values()].some(b => b.svc === 'clinic' || b.svc === 'hospital')) opts.push('Is there a doctor anywhere in this city?');
    if (S.tax.res > 13) opts.push('Taxes went up again? Thinking about moving.');
    if (S.demand.rlow > 60 && st.pop < 600) opts.push('Everyone wants to move here. Zone more homes!');
    if (!opts.length) return;
    S.notify(U.pick(FIRST, S.rng) + ': "' + U.pick(opts, S.rng) + '"', 'chirp');
  }
  function checkMilestones() {
    while (S.milestone < C.MILESTONES.length - 1 && S.stats.pop >= C.MILESTONES[S.milestone + 1].pop) {
      S.milestone++;
      const m = C.MILESTONES[S.milestone];
      S.money += m.reward;
      if (CB.UI) CB.UI.milestone(m);
    }
  }

  // ------------------------------------------------------------------
  // Main step (dt in sim seconds)
  // ------------------------------------------------------------------
  S.step = function (dt) {
    const dtH = dt / C.HOUR_SEC;
    const prevHour = S.hour;
    S.hour += dtH;
    let newDay = false;
    if (S.hour >= 24) { S.hour -= 24; newDay = true; }
    // construction
    S.buildings.forEach(b => {
      if (b.state === 'build') {
        b.st += dtH;
        if (b.st >= b.buildT) {
          b.state = 'live'; b.st = 0;
          CB.Meshes.refreshBuilding(b);
          b._h = 0;
          if (S.isRes(b)) moveIn(b);
          S.zoneTexDirty = true;
        }
      }
    });
    generateTrips(dtH);
    S.tickAcc += dtH;
    if (S.tickAcc >= 0.25) {
      S.tickAcc = 0;
      if (S.covDirty) computeCoverage();
      refreshLists();
      matchJobs();
      computeDemand();
      growth();
      checkMilestones();
    }
    S.hourAcc += dtH;
    if (S.hourAcc >= 1) {
      S.hourAcc -= 1;
      hourlyBuildings();
      hourlyEconomy();
      dispatchServices();
      if (Math.floor(S.hour) % 3 === 0) computeCoverage();
      if (S.rng() < 0.06 && S.hour > 7 && S.hour < 22) chirp();
    }
    if (newDay) { S.month++; monthly(); }
  };

  // ------------------------------------------------------------------
  // Overlays
  // ------------------------------------------------------------------
  const ramp = v => { v = U.clamp(v, 0, 1); return v < 0.5 ? [0.9, 0.2 + v * 1.3, 0.15, 0.85] : [0.9 - (v - 0.5) * 1.5, 0.85, 0.2, 0.85]; };
  S.overlayFn = function (key) {
    const Wd = CB.World, cv = S.cov;
    const play = i => U.inPlay(U.tx(i), U.ty(i));
    switch (key) {
      case 'traffic': return i => {
        const rt = Wd.road[i]; if (!rt) return null;
        const r = U.clamp(CB.Traffic.load[i] / C.ROADS[rt].cap, 0, 1);
        return ramp(1 - r);
      };
      case 'lv': return i => play(i) ? ramp(cv.lv[i] / 70) : null;
      case 'pollution': return i => { const v = Math.min(1, cv.pollution[i]); return v > 0.03 ? [0.55 + v * 0.3, 0.42 - v * 0.2, 0.15, U.clamp(v * 1.4, 0, 0.9)] : (play(i) ? [0.3, 0.75, 0.35, 0.35] : null); };
      case 'noise': return i => { const v = cv.noise[i]; return v > 0.05 ? [0.9, 0.5 - v * 0.3, 0.9 - v * 0.6, U.clamp(v, 0, 0.9)] : null; };
      case 'happy': return i => { const b = Wd.bld[i] && S.buildings.get(Wd.bld[i]); return b && b.kind === 'zone' ? ramp(b.happy / 100) : null; };
      case 'transit': return i => play(i) ? [0.2, 0.6, 1, cv.transit[i] * 0.75] : null;
      case 'garbage': return i => {
        const b = Wd.bld[i] && S.buildings.get(Wd.bld[i]);
        if (b && b.kind === 'zone') return ramp(1 - b.garbage / 150);
        return play(i) && cv.garbage[i] > 0 ? [0.3, 0.7, 0.4, cv.garbage[i] * 0.35] : null;
      };
      default: return i => play(i) ? ramp(Math.min(1, cv[key][i])) : null;
    }
  };

  // ------------------------------------------------------------------
  // Save / load
  // ------------------------------------------------------------------
  S.serialize = function () {
    const Wd = CB.World;
    const bl = [];
    S.buildings.forEach(b => bl.push({
      id: b.id, kind: b.kind, zone: b.zone, svc: b.svc, x: b.x, y: b.y, fw: b.fw, fh: b.fh, w: b.w, d: b.d, dir: b.dir, road: b.road,
      level: b.level, state: b.state === 'fire' ? 'live' : b.state, st: b.st, buildT: b.buildT, seed: b.seed, res: b.res, cap: b.cap, jobs: b.jobs, filled: b.filled, outside: b.outside,
      work: b.work, happy: Math.round(b.happy), garbage: Math.round(b.garbage), prog: b.prog, low: b.low, abandT: b.abandT, custRatio: b.custRatio, commute: Math.round(b.commute), age: b.age,
    }));
    return {
      v: 1, seed: Wd.seed, name: S.name, money: S.money, month: S.month, hour: S.hour, milestone: S.milestone, tax: S.tax, loans: S.loans, nextId: S.nextId,
      history: S.history, last: S.last, budget: S.budget,
      road: U.encodeRLE(Wd.road), rail: U.encodeRLE(Wd.rail), zone: U.encodeRLE(Wd.zone), tree: U.encodeRLE(Wd.tree),
      buildings: bl, transit: CB.Transit.serialize(),
    };
  };
  S.load = function (d) {
    const Wd = CB.World;
    S.init({ name: d.name, seed: d.seed });
    Object.assign(S, { money: d.money, month: d.month, hour: d.hour, milestone: d.milestone, tax: d.tax, loans: d.loans || [], nextId: d.nextId, history: d.history || [], last: d.last || blankBudget(), budget: d.budget || blankBudget() });
    Wd.road.set(U.decodeRLE(d.road, Uint8Array, N));
    Wd.rail.set(U.decodeRLE(d.rail, Uint8Array, N));
    Wd.zone.set(U.decodeRLE(d.zone, Uint8Array, N));
    Wd.tree.set(U.decodeRLE(d.tree, Uint8Array, N));
    Wd.updateZonable(); Wd.updateConn(); Wd.roadVer++;
    for (const o of d.buildings) {
      const b = Object.assign({ cust: 0, gTarget: false, vehOut: 0, fire: 0, prob: null }, o);
      let mx = -1e9, mn = 1e9;
      for (let y = b.y; y <= b.y + b.fh; y++) for (let x = b.x; x <= b.x + b.fw; x++) { const h = Wd.cornerH(x, y); mx = Math.max(mx, h); mn = Math.min(mn, h); }
      b.baseY = Math.max(mx, C.WATER + 0.3) + 0.05; b.minY = mn;
      for (const t of lotTiles(b)) Wd.bld[t] = b.id;
      b.name = nameFor(b);
      S.buildings.set(b.id, b);
      CB.Meshes.addBuilding(b);
    }
    CB.Transit.load(d.transit);
    S.covDirty = true; S.lotsDirty = true; S.zoneTexDirty = true;
    computeCoverage();
    hourlyBuildings();
    computeDemand();
  };
})();

</script>
<script>
'use strict';
// Arterial — input handling and build tools
(function () {
  const { C, U } = CB;
  const T = C.TILE;
  const Tl = CB.Tools = { tool: { type: 'select' }, hover: null, drag: null, rot: 0, lineStops: [], tip: '' };

  Tl.setTool = function (t) {
    Tl.tool = t || { type: 'select' };
    Tl.drag = null;
    Tl.lineStops = [];
    clearPreview();
    const isZone = Tl.tool.type === 'zone' || Tl.tool.type === 'dezone';
    CB.Gfx.uni.uGrid.value = isZone ? 1 : 0;
    CB.Meshes.updateZoneTex(isZone);
    Tl.zoneView = isZone;
    const transitTool = Tl.tool.type === 'line' || Tl.tool.type === 'stop' || Tl.tool.type === 'rail';
    CB.Transit.showRibbons(transitTool || CB.UI.overlay === 'transit');
    if (Tl.tool.type === 'svc') Tl.rot = 0;
    CB.UI.onToolChange();
  };
  function clearPreview() {
    const Mx = CB.Meshes;
    Mx.setGhostTiles([]); Mx.setGhostBox(null); Mx.setRing(null);
    CB.Gfx.uni.uBrushOn.value = 0;
    if (Tl.previewRibbon) { Mx.lineGroup.remove(Tl.previewRibbon); Tl.previewRibbon.geometry.dispose(); Tl.previewRibbon = null; }
    Tl.tip = '';
  }

  function spend(cost) {
    const S = CB.Sim;
    if (S.money < cost) { CB.UI.toast('Not enough money. You need ' + U.money(cost) + '.', 'bad'); return false; }
    S.money -= cost; return true;
  }

  // ---------------- path helpers ----------------
  function lPath(a, b) {
    const ax = U.tx(a), ay = U.ty(a), bx = U.tx(b), by = U.ty(b);
    const out = [];
    const horizFirst = Math.abs(bx - ax) >= Math.abs(by - ay);
    let x = ax, y = ay;
    out.push(U.idx(x, y));
    const sx = Math.sign(bx - ax), sy = Math.sign(by - ay);
    if (horizFirst) { while (x !== bx) { x += sx; out.push(U.idx(x, y)); } while (y !== by) { y += sy; out.push(U.idx(x, y)); } }
    else { while (y !== by) { y += sy; out.push(U.idx(x, y)); } while (x !== bx) { x += sx; out.push(U.idx(x, y)); } }
    return out;
  }
  function roadEval(tiles, rt) {
    const Wd = CB.World, R = C.ROADS[rt];
    let cost = 0, bad = null;
    const list = tiles.map(i => {
      let ok = true, col = null, c = 0;
      if (!Wd.roadOK(i)) { ok = false; bad = U.inPlay(U.tx(i), U.ty(i)) ? 'Too steep here' : 'Outside the city limits'; }
      else if (Wd.bld[i]) { ok = false; bad = 'A building is in the way'; }
      else if (Wd.road[i] === rt) { col = [0.5, 0.7, 1.0]; }
      else if (Wd.road[i]) { c = Math.max(0, R.cost - C.ROADS[Wd.road[i]].cost) + 5; col = [1, 0.85, 0.3]; }
      else c = R.cost * (Wd.isWater(i) ? 3 : 1);
      cost += c;
      const y = Wd.isWater(i) ? Wd.BRIDGE_H : undefined;
      return { i, ok, col, y, h: 0.4 };
    });
    return { list, cost, bad };
  }
  function railEval(tiles, rr) {
    const Wd = CB.World, R = C.RAIL[rr];
    let cost = 0, bad = null;
    const list = tiles.map(i => {
      let ok = true, col = null, c = 0;
      const x = U.tx(i), y = U.ty(i);
      if (!U.inPlay(x, y)) { ok = false; bad = 'Outside the city limits'; }
      else if (rr === 1 && Wd.bld[i]) { ok = false; bad = 'A building is in the way. Use a subway tunnel to go under it.'; }
      else if (Wd.rail[i] === rr) col = [0.5, 0.7, 1.0];
      else c = R.cost * (rr === 1 && Wd.isWater(i) ? 1.5 : 1);
      cost += c;
      const yy = rr === 1 ? Wd.deckH((x + 0.5) * T, (y + 0.5) * T) - 1 : undefined;
      return { i, ok, col: col || (rr === 2 && ok ? [0.75, 0.55, 1] : null), y: yy, h: 0.5 };
    });
    return { list, cost, bad };
  }

  // ---------------- pointer handling ----------------
  let mouse = { x: 0, y: 0, down: false, btn: -1, sx: 0, sy: 0, moved: false };
  Tl.mouse = mouse;
  Tl.init = function (el) {
    el.addEventListener('contextmenu', e => e.preventDefault());
    el.addEventListener('pointerdown', e => {
      if (e.target.closest && e.target.closest('.ui')) return;
      el.setPointerCapture(e.pointerId);
      mouse.down = true; mouse.btn = e.button; mouse.sx = mouse.x = e.clientX; mouse.sy = mouse.y = e.clientY; mouse.moved = false;
      mouse.touchPan = e.pointerType === 'touch' && Tl.tool.type === 'select';
      if (e.button === 0 && !mouse.touchPan) onDown();
    });
    el.addEventListener('pointermove', e => {
      const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y;
      mouse.x = e.clientX; mouse.y = e.clientY;
      if (Math.abs(mouse.x - mouse.sx) + Math.abs(mouse.y - mouse.sy) > 4) mouse.moved = true;
      const cam = CB.Gfx.cam;
      if (mouse.down && (mouse.btn === 2 || (mouse.btn === 0 && e.altKey))) {
        cam.yaw -= dx * 0.005; cam.pitch = U.clamp(cam.pitch + dy * 0.004, 0.12, 1.45);
      } else if (mouse.down && (mouse.btn === 1 || mouse.touchPan)) {
        const k = cam.dist * 0.0016;
        const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
        cam.tx += (-dx * rx + dy * fx) * k; cam.tz += (-dx * rz + dy * fz) * k;
      }
      Tl.needHover = true;
    });
    el.addEventListener('pointerup', e => {
      if (mouse.btn === 0 && !mouse.touchPan) onUp(e);
      if (mouse.btn === 2 && !mouse.moved) onRightClick();
      mouse.down = false; mouse.btn = -1;
    });
    el.addEventListener('wheel', e => {
      e.preventDefault();
      CB.Gfx.cam.tdist *= Math.exp(e.deltaY * 0.0011);
    }, { passive: false });
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', e => { CB.Gfx.cam.keys[keyName(e)] = false; });
    window.addEventListener('blur', () => { CB.Gfx.cam.keys = {}; });
  };
  function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key; }
  function onKey(e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
    const k = keyName(e);
    const S = CB.Sim;
    if (k === 'r' && Tl.tool.type === 'svc') { Tl.rot = (Tl.rot + 1) % 4; Tl.needHover = true; return; }
    CB.Gfx.cam.keys[k] = true;
    if (e.key === 'Shift') CB.Gfx.cam.keys.Shift = true;
    if (k === ' ') { e.preventDefault(); CB.UI.setSpeed(S.speed === 0 ? (CB.UI.lastSpeed || 1) : 0); }
    else if (k === '1') CB.UI.setSpeed(1);
    else if (k === '2') CB.UI.setSpeed(2);
    else if (k === '3') CB.UI.setSpeed(4);
    else if (k === 'Escape') {
      if (Tl.tool.type === 'line' && Tl.lineStops.length) { Tl.lineStops = []; refreshLinePreview(); }
      else if (Tl.tool.type !== 'select') Tl.setTool(null);
      else { CB.UI.select(null); CB.UI.closePanels(); }
    }
    else if (k === 'b') Tl.setTool({ type: 'bulldoze' });
    else if (k === 'Enter' && Tl.tool.type === 'line') finishLine();
    else if (k === 'Backspace' && Tl.tool.type === 'line') { Tl.lineStops.pop(); refreshLinePreview(); }
  }
  function onRightClick() {
    if (Tl.tool.type === 'line' && Tl.lineStops.length) { Tl.lineStops.pop(); refreshLinePreview(); }
    else if (Tl.tool.type !== 'select' && !mouse.moved) Tl.setTool(null);
  }

  function onDown() {
    const h = Tl.hover; if (!h || h.i < 0) return;
    const t = Tl.tool.type;
    if (t === 'road' || t === 'rail' || t === 'zone' || t === 'dezone' || t === 'bulldoze') Tl.drag = { start: h.i };
  }
  function onUp() {
    const h = Tl.hover;
    const t = Tl.tool;
    const S = CB.Sim, Wd = CB.World;
    if (t.type === 'select') {
      if (mouse.moved || !h) return;
      const v = CB.Traffic.pick(h.x, h.z, 6);
      const bid = h.i >= 0 ? Wd.bld[h.i] : 0;
      if (bid) { CB.UI.select(S.buildings.get(bid)); return; }
      if (v) { CB.UI.selectVehicle(v); return; }
      const st = h.i >= 0 && CB.Transit.stops.find(s => s.tile === h.i);
      if (st) { CB.UI.selectStop(st); return; }
      CB.UI.select(null);
      return;
    }
    if (t.type === 'road' && Tl.drag) {
      const tiles = lPath(Tl.drag.start, h ? h.i : Tl.drag.start);
      const ev = roadEval(tiles, t.rt);
      Tl.drag = null; clearPreview();
      if (ev.bad) { CB.UI.toast(ev.bad, 'bad'); return; }
      if (!spend(ev.cost)) return;
      let changed = false;
      for (const i of tiles) if (Wd.road[i] !== t.rt) { S.setRoad(i, t.rt); changed = true; }
      if (changed) { S.networkChanged(); CB.UI.sfx('build'); }
      return;
    }
    if (t.type === 'rail' && Tl.drag) {
      const tiles = lPath(Tl.drag.start, h ? h.i : Tl.drag.start);
      const ev = railEval(tiles, t.rr);
      Tl.drag = null; clearPreview();
      if (ev.bad) { CB.UI.toast(ev.bad, 'bad'); return; }
      if (!spend(ev.cost)) return;
      for (const i of tiles) if (Wd.rail[i] !== t.rr) S.setRail(i, t.rr);
      S.networkChanged(); CB.UI.sfx('build');
      return;
    }
    if ((t.type === 'zone' || t.type === 'dezone') && Tl.drag) {
      const r = rectOf(Tl.drag.start, h ? h.i : Tl.drag.start);
      Tl.drag = null; CB.Gfx.uni.uBrushOn.value = 0;
      let n = 0;
      for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) {
        const i = U.idx(x, y);
        if (S.setZone(i, t.type === 'zone' ? t.z : 0)) n++;
      }
      if (n) { CB.Meshes.updateZoneTex(true); CB.UI.sfx('zone'); }
      return;
    }
    if (t.type === 'bulldoze' && Tl.drag) {
      const r = rectOf(Tl.drag.start, h ? h.i : Tl.drag.start);
      Tl.drag = null; CB.Gfx.uni.uBrushOn.value = 0;
      bulldoze(r);
      return;
    }
    if (!h || h.i < 0) return;
    if (t.type === 'svc') {
      const sv = C.SERVICES[t.key];
      const lot = S.serviceLot(t.key, h.tx, h.ty, Tl.rot);
      if (!lot.ok) { CB.UI.toast(lot.reason, 'bad'); return; }
      if (!spend(sv.cost)) return;
      const b = S.placeService(t.key, lot);
      CB.Meshes.updateZoneTex(false);
      CB.UI.sfx('build');
      CB.UI.toast(sv.name + ' built.', 'good');
      return;
    }
    if (t.type === 'stop') {
      const why = CB.Transit.canPlaceStop(t.st, h.i);
      if (why) { CB.UI.toast(why, 'bad'); return; }
      const cost = stopCost(t.st, h.i);
      if (!spend(cost)) return;
      CB.Transit.addStop(t.st, h.i);
      CB.UI.sfx('build');
      return;
    }
    if (t.type === 'line') { lineClick(h.i); return; }
  }
  function stopCost(type, i) {
    if (type === 'bus') return C.TRANSIT.bus.stopCost;
    return CB.World.rail[i] === 2 ? C.TRANSIT.rail.ugStopCost : C.TRANSIT.rail.stopCost;
  }
  function rectOf(a, b) {
    return { x0: Math.min(U.tx(a), U.tx(b)), x1: Math.max(U.tx(a), U.tx(b)), y0: Math.min(U.ty(a), U.ty(b)), y1: Math.max(U.ty(a), U.ty(b)) };
  }
  function bulldoze(r) {
    const S = CB.Sim, Wd = CB.World, X = CB.Transit;
    let net = false, refund = 0, any = false;
    const single = r.x0 === r.x1 && r.y0 === r.y1;
    const killB = i => {
      const b = S.buildings.get(Wd.bld[i]);
      if (b) { if (b.kind === 'svc') refund += C.SERVICES[b.svc].cost * 0.25; S.removeBuilding(b); any = true; }
    };
    const killStops = i => { for (const s of X.stops.filter(s => s.tile === i)) { X.removeStop(s); any = true; } };
    const killRail = i => { S.setRail(i, 0); net = true; any = true; };
    const killRoad = i => { refund += C.ROADS[Wd.road[i]].cost * 0.5; S.setRoad(i, 0); net = true; any = true; };
    if (single) {
      if (!U.inPlay(r.x0, r.y0)) return;
      const i = U.idx(r.x0, r.y0);
      if (Wd.bld[i]) killB(i);
      else if (X.stops.some(s => s.tile === i)) killStops(i);
      else if (Wd.rail[i]) killRail(i);
      else if (Wd.road[i]) killRoad(i);
    } else {
      for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) {
        if (!U.inPlay(x, y)) continue;
        const i = U.idx(x, y);
        if (Wd.bld[i]) killB(i);
        killStops(i);
        if (Wd.rail[i]) killRail(i);
        if (Wd.road[i]) killRoad(i);
      }
    }
    if (net) S.networkChanged();
    if (refund) S.money += refund;
    if (any) { CB.Meshes.updateZoneTex(false); CB.UI.sfx('demolish'); }
  }

  // ---------------- transit lines ----------------
  function lineClick(i) {
    const X = CB.Transit, type = Tl.tool.lt;
    let s = X.stopAtTile(i, type);
    if (!s) {
      const why = X.canPlaceStop(type, i);
      if (why) { CB.UI.toast(type === 'bus' ? 'Click a road to add a stop' : 'Click on rail track to add a station', 'bad'); return; }
      if (!spend(stopCost(type, i))) return;
      s = X.addStop(type, i);
    }
    const L = Tl.lineStops;
    if (L.length >= 2 && s.id === L[0]) { finishLine(); return; }
    if (L.includes(s.id)) return;
    // check that the new stop is reachable
    if (L.length) {
      const prev = X.stopById(L[L.length - 1]);
      const p = type === 'bus' ? CB.Traffic.findPath(prev.tile, s.tile, true) : CB.Traffic.findRailPath(prev.tile, s.tile);
      if (!p) { CB.UI.toast(type === 'bus' ? 'No road connects these stops' : 'No track connects these stations', 'bad'); return; }
    }
    L.push(s.id);
    CB.UI.sfx('click');
    refreshLinePreview();
  }
  function finishLine() {
    const X = CB.Transit;
    if (Tl.lineStops.length < 2) { CB.UI.toast('A line needs at least two stops', 'bad'); return; }
    const l = X.createLine(Tl.tool.lt, Tl.lineStops);
    Tl.lineStops = [];
    refreshLinePreview();
    if (l.broken) CB.UI.toast('The line cannot loop back to its first stop. Check that roads or tracks connect.', 'bad');
    else { CB.UI.toast(l.name + ' created with ' + l.stops.length + ' stops.', 'good'); CB.UI.sfx('build'); }
    CB.UI.refreshTransit();
  }
  function refreshLinePreview(hoverTile) {
    const Mx = CB.Meshes, X = CB.Transit, Wd = CB.World;
    if (Tl.previewRibbon) { Mx.lineGroup.remove(Tl.previewRibbon); Tl.previewRibbon.geometry.dispose(); Tl.previewRibbon = null; }
    const L = Tl.lineStops.map(id => X.stopById(id)).filter(Boolean);
    const tiles = L.map(s => s.tile);
    if (hoverTile !== undefined && hoverTile >= 0 && tiles.length) tiles.push(hoverTile);
    if (tiles.length < 2) return;
    const pts = [];
    const type = Tl.tool.lt;
    for (let k = 0; k < tiles.length - 1; k++) {
      const p = type === 'bus' ? CB.Traffic.findPath(tiles[k], tiles[k + 1], true) : CB.Traffic.findRailPath(tiles[k], tiles[k + 1]);
      if (!p) continue;
      for (const i of p) {
        const x = (U.tx(i) + 0.5) * T, z = (U.ty(i) + 0.5) * T;
        const y = type === 'bus' ? Wd.roadH(x, z) + 2 : (Wd.rail[i] === 1 ? Wd.deckH(x, z) + 2 : Math.max(Wd.groundH(x, z), 0) + 2.5);
        pts.push(x, y, z);
      }
    }
    Tl.previewRibbon = Mx.ribbon(pts, 2.2, '#ffffff', false);
    if (Tl.previewRibbon) Mx.lineGroup.add(Tl.previewRibbon);
  }

  // test hook: perform a tool action from tile a to tile b as if the player dragged
  Tl._simulate = function (tool, a, b) {
    Tl.setTool(tool);
    const mk = i => ({ i, tx: U.tx(i), ty: U.ty(i), x: (U.tx(i) + 0.5) * T, z: (U.ty(i) + 0.5) * T });
    Tl.hover = mk(a);
    mouse.moved = false;
    onDown();
    Tl.hover = mk(b);
    onUp();
  };

  // ---------------- per-frame hover & previews ----------------
  Tl.update = function () {
    const G = CB.Gfx, Mx = CB.Meshes, Wd = CB.World, S = CB.Sim;
    if (Tl.needHover || Tl.drag || Tl.tool.type !== 'select') {
      Tl.needHover = false;
      Tl.hover = G.pick(mouse.x, mouse.y);
    }
    const h = Tl.hover, t = Tl.tool;
    if (!h || h.i < 0) { if (t.type !== 'select') { Mx.setGhostTiles([]); Mx.setGhostBox(null); Mx.setRing(null); } Tl.tip = ''; return; }
    if (t.type === 'road') {
      const tiles = Tl.drag ? lPath(Tl.drag.start, h.i) : [h.i];
      const ev = roadEval(tiles, t.rt);
      Mx.setGhostTiles(ev.list);
      Tl.tip = (Tl.drag ? tiles.length + ' tiles · ' : '') + U.money(ev.cost) + (ev.bad ? ' · ' + ev.bad : '');
    } else if (t.type === 'rail') {
      const tiles = Tl.drag ? lPath(Tl.drag.start, h.i) : [h.i];
      const ev = railEval(tiles, t.rr);
      Mx.setGhostTiles(ev.list);
      Tl.tip = (Tl.drag ? tiles.length + ' tiles · ' : '') + U.money(ev.cost) + (ev.bad ? ' · ' + ev.bad : '');
    } else if (t.type === 'zone' || t.type === 'dezone' || t.type === 'bulldoze') {
      const r = Tl.drag ? rectOf(Tl.drag.start, h.i) : rectOf(h.i, h.i);
      G.uni.uBrushOn.value = 1;
      G.uni.uBrush.value.set(r.x0 * T, r.y0 * T, (r.x1 + 1) * T, (r.y1 + 1) * T);
      if (t.type === 'zone') { const c = U.hex(C.ZONES[t.z].color); G.uni.uBrushCol.value.setRGB(c[0], c[1], c[2]); }
      else G.uni.uBrushCol.value.setRGB(1, 0.3, 0.25);
      if (t.type === 'bulldoze') {
        const bid = Wd.bld[h.i];
        const b = bid && S.buildings.get(bid);
        if (b && !Tl.drag) {
          Mx.setGhostBox(b.x * T, b.y * T, (b.x + b.fw) * T, (b.y + b.fh) * T, b.baseY - 0.5, 3, false);
          Tl.tip = 'Demolish ' + b.name;
        } else { Mx.setGhostBox(null); Tl.tip = Tl.drag ? 'Release to demolish everything in the area' : 'Click or drag to demolish'; }
      } else {
        const z = Wd.zonable[h.i];
        Tl.tip = t.type === 'zone' ? (z ? C.ZONES[t.z].name : 'Zones must be within 3 tiles of a road') : 'Remove zoning';
      }
    } else if (t.type === 'svc') {
      const sv = C.SERVICES[t.key];
      const lot = S.serviceLot(t.key, h.tx, h.ty, Tl.rot);
      const y = Math.max(Wd.groundH((lot.x + lot.fw / 2) * T, (lot.y + lot.fh / 2) * T), 0);
      Mx.setGhostBox(lot.x * T, lot.y * T, (lot.x + lot.fw) * T, (lot.y + lot.fh) * T, y, 9, lot.ok);
      Mx.setRing((lot.x + lot.fw / 2) * T, (lot.y + lot.fh / 2) * T, sv.radius * T);
      Tl.tip = sv.name + ' · ' + U.money(sv.cost) + (lot.ok ? ' · R to rotate' : ' · ' + lot.reason);
    } else if (t.type === 'stop') {
      const why = CB.Transit.canPlaceStop(t.st, h.i);
      Mx.setGhostTiles([{ i: h.i, ok: !why, y: t.st === 'rail' && Wd.rail[h.i] === 1 ? Wd.deckH(h.x, h.z) : undefined, h: 3 }]);
      Tl.tip = why || ((t.st === 'bus' ? 'Bus stop' : 'Station') + ' · ' + U.money(stopCost(t.st, h.i)));
    } else if (t.type === 'line') {
      const X = CB.Transit;
      const s = X.stopAtTile(h.i, t.lt);
      if (Tl._lastHoverTile !== h.i) { Tl._lastHoverTile = h.i; refreshLinePreview(h.i); }
      Mx.setGhostTiles([{ i: h.i, ok: !!s || !X.canPlaceStop(t.lt, h.i), h: 2 }]);
      const L = Tl.lineStops;
      if (s && L.length >= 2 && s.id === L[0]) Tl.tip = 'Click to finish the line';
      else if (s) Tl.tip = s.name + (L.length ? ' · add to line' : ' · start line here');
      else Tl.tip = X.canPlaceStop(t.lt, h.i) ? (t.lt === 'bus' ? 'Click a road' : 'Click rail track') : 'New ' + (t.lt === 'bus' ? 'stop' : 'station') + ' · ' + U.money(stopCost(t.lt, h.i));
    } else {
      Tl.tip = '';
      if (h.i >= 0) {
        const bid = Wd.bld[h.i];
        Tl.hoverB = bid ? S.buildings.get(bid) : null;
      }
    }
  };
})();

</script>
<script>
'use strict';
// Arterial — DOM interface: top bar, tool dock, panels, info views, goals, toasts
(function () {
  const { C, U } = CB;
  const $ = id => document.getElementById(id);
  const UI = CB.UI = { selected: null, selVehicle: null, selStop: null, overlay: null, panel: null, lastSpeed: 1, follow: false };

  // ---------------- icons ----------------
  const IC = {
    street: '<path d="M8 3L5 21M16 3l3 18M12 4v3M12 10v3M12 16v3"/>',
    avenue: '<path d="M6 3L3 21M18 3l3 18M10 4v3M10 10v3M10 16v3M14 4v3M14 10v3M14 16v3"/>',

    ind: '<path d="M3 20V10l5 3V10l5 3V10l5 3V4h3v16zM3 20h18"/>',

    police: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
    fire: '<path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-6 1-9z"/>',
    health: '<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
    edu: '<path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5"/>',
    garbage: '<path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/>',
    park: '<path d="M12 21v-6M12 3l6 9H6zM12 7l5 8H7z"/>',
    plaza: '<path d="M4 20h16M6 20c0-3 2-4 6-4s6 1 6 4M12 16V8M9 6c1-2 5-2 6 0"/>',
    stadium: '<ellipse cx="12" cy="12" rx="9" ry="6"/><ellipse cx="12" cy="12" rx="4" ry="2.5"/>',
    tower: '<path d="M12 2v4M9 6h6l-1 4h-4zM10.5 10L9 21h6l-1.5-11"/>',
    arch: '<path d="M3 21V6h18v15M7 21v-9a5 5 0 0 1 10 0v9"/>',
    busstop: '<path d="M6 21V3M6 4h8v6H6M10 21v-6"/>',
    busline: '<rect x="4" y="4" width="16" height="13" rx="2"/><path d="M4 11h16M7 21v-4M17 21v-4"/>',
    elev: '<path d="M3 8h18M3 12h18M6 12v9M18 12v9M7 8V5M12 8V5M17 8V5"/>',
    sub: '<path d="M3 20a9 9 0 0 1 18 0M7 20a5 5 0 0 1 10 0M12 7V3"/>',
    station: '<rect x="3" y="8" width="18" height="8" rx="2"/><path d="M2 8l10-5 10 5M8 20l1-4M16 20l-1-4"/>',
    metro: '<rect x="6" y="3" width="12" height="15" rx="4"/><path d="M6 11h12M9 21l1-3M15 21l-1-3"/>',
    zones: '<path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/>',
    bulldoze: '<path d="M5 5l14 14M19 5L5 19"/>',
  };
  const svg = k => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (IC[k] || '') + '</svg>';
  const SVC_ICON = { police: 'police', policehq: 'police', fire: 'fire', clinic: 'health', hospital: 'health', elem: 'edu', high: 'edu', univ: 'edu', garbage: 'garbage', park: 'park', plaza: 'plaza', bigpark: 'park', stadium: 'stadium', tower: 'tower', arch: 'arch' };
  const SVC_COL = { police: '#2c5aa0', fire: '#b8322a', health: '#c8323e', edu: '#a0632f', garbage: '#4d7a4a', park: '#3f8a3a', landmark: '#8a6a2a' };

  function catItems(key) {
    const S = CB.Sim, items = [];
    if (key === 'roads') {
      for (let r = 1; r <= 3; r++) { const R = C.ROADS[r]; items.push({ name: R.name, cost: U.money(R.cost) + ' / tile', unlock: R.unlock, tool: { type: 'road', rt: r }, icon: R.key, col: '#3a4048', desc: R.desc }); }
    } else if (key === 'zones') {
      for (let z = 1; z < C.ZONES.length; z++) { const Z = C.ZONES[z]; items.push({ name: Z.name, cost: 'Free', unlock: Z.unlock, tool: { type: 'zone', z }, icon: Z.key, col: Z.color }); }
      items.push({ name: 'Remove Zoning', cost: 'Free', unlock: 0, tool: { type: 'dezone' }, icon: 'dezone', col: '#555c66' });
    } else if (key === 'transit') {
      items.push({ name: 'Bus Stop', cost: U.money(C.TRANSIT.bus.stopCost), unlock: 1, tool: { type: 'stop', st: 'bus' }, icon: 'busstop', col: '#2f86e0' });
      items.push({ name: 'Bus Line', cost: U.money(C.TRANSIT.bus.upkeep) + ' / bus / mo', unlock: 1, tool: { type: 'line', lt: 'bus' }, icon: 'busline', col: '#2f86e0' });
      items.push({ name: C.RAIL[1].name, cost: U.money(C.RAIL[1].cost) + ' / tile', unlock: 3, tool: { type: 'rail', rr: 1 }, icon: 'elev', col: '#7a5a9a' });
      items.push({ name: C.RAIL[2].name, cost: U.money(C.RAIL[2].cost) + ' / tile', unlock: 3, tool: { type: 'rail', rr: 2 }, icon: 'sub', col: '#5a4a7a' });
      items.push({ name: 'Train Station', cost: U.money(C.TRANSIT.rail.stopCost) + '+', unlock: 3, tool: { type: 'stop', st: 'rail' }, icon: 'station', col: '#e85d2a' });
      items.push({ name: 'Train / Metro Line', cost: U.money(C.TRANSIT.rail.upkeep) + ' / train / mo', unlock: 3, tool: { type: 'line', lt: 'rail' }, icon: 'metro', col: '#e85d2a' });
    } else {
      for (const k in C.SERVICES) {
        const sv = C.SERVICES[k]; if (sv.cat !== key) continue;
        items.push({ name: sv.name, cost: U.money(sv.cost), unlock: sv.unlock, tool: { type: 'svc', key: k }, icon: SVC_ICON[k], col: SVC_COL[sv.cov] || '#555', desc: sv.desc });
      }
    }
    return items;
  }
  const CATS = [
    { key: 'roads', name: 'Roads', icon: 'avenue', hint: 'Drag to draw. Roads bend once at the corner. Start from the highway.' },
    { key: 'zones', name: 'Zoning', icon: 'zones', hint: 'Drag a rectangle along roads. Buildings grow when there is demand.' },
    { key: 'services', name: 'Services', icon: 'police', hint: 'Buildings must face a road. Press R to rotate.' },
    { key: 'parks', name: 'Parks', icon: 'park', hint: 'Parks raise happiness and land value, so buildings level up.' },
    { key: 'transit', name: 'Transit', icon: 'busline', hint: 'Choose a line tool, click stops in order, then click the first stop again to close the loop.' },
    { key: 'landmarks', name: 'Landmarks', icon: 'arch', hint: 'Landmarks unlock at large populations and attract visitors.' },
  ];

  // ---------------- init ----------------
  UI.init = function () {
    const tb = $('toolbar');
    tb.innerHTML = CATS.map(c => `<button class="tbtn" data-cat="${c.key}" title="${c.name}">${svg(c.icon)}<span>${c.name}</span></button>`).join('') +
      '<div class="sep"></div><button class="tbtn danger" id="bdz" title="Bulldoze (B)">' + svg('bulldoze') + '<span>Bulldoze</span></button>';
    tb.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => UI.openCat(b.dataset.cat === UI.cat ? null : b.dataset.cat)));
    $('bdz').addEventListener('click', () => { UI.openCat(null); CB.Tools.setTool(CB.Tools.tool.type === 'bulldoze' ? null : { type: 'bulldoze' }); });
    for (const s of [0, 1, 2, 4]) $('sp' + s).addEventListener('click', () => UI.setSpeed(s));
    document.querySelectorAll('#menu [data-panel]').forEach(b => b.addEventListener('click', () => UI.openPanel(UI.panel === b.dataset.panel ? null : b.dataset.panel)));
    // demand bars
    const D = [['rlow', 'L', '#5fcf5a'], ['rmed', 'M', '#2f9e48'], ['rhigh', 'H', '#167a3a'], ['com', 'C', '#59a6f5'], ['ind', 'I', '#f0c43a'], ['off', 'O', '#b276f2']];
    $('demand').innerHTML = D.map(d => `<div class="dbar" id="dm_${d[0]}" title="${d[0]}"><div class="track"><i style="background:${d[2]}"></i></div><span>${d[1]}</span></div>`).join('');
    const titles = { rlow: 'Residential · low density', rmed: 'Residential · medium density', rhigh: 'Residential · high density', com: 'Commercial', ind: 'Industrial', off: 'Office' };
    for (const d of D) $('dm_' + d[0]).title = titles[d[0]] + ' demand';
    document.addEventListener('pointermove', e => { const t = $('tip'); t.style.left = e.clientX + 'px'; t.style.top = e.clientY + 'px'; });
    UI.goalsOpen = true;
    setInterval(UI.update, 250);
  };

  UI.openCat = function (key) {
    UI.cat = key;
    document.querySelectorAll('#toolbar [data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat === key));
    const p = $('palette');
    if (!key) { p.hidden = true; if (CB.Tools.tool.type !== 'bulldoze') CB.Tools.setTool(null); return; }
    renderPalette();
    p.hidden = false;
    CB.Tools.setTool(null);
  };
  function renderPalette() {
    const key = UI.cat; if (!key) return;
    const S = CB.Sim, cat = CATS.find(c => c.key === key);
    const items = catItems(key);
    const p = $('palette');
    p.innerHTML = items.map((it, k) => {
      const locked = !S.unlocked(it.unlock);
      return `<button class="card ${locked ? 'locked' : ''}" data-k="${k}" title="${it.desc || it.name}">
        ${locked ? `<span class="lock">${C.MILESTONES[it.unlock].name}</span>` : ''}
        <div class="sw" style="background:${it.col}">${svg(it.icon)}</div>
        <b>${it.name}</b><small>${locked ? C.MILESTONES[it.unlock].pop.toLocaleString() + ' residents' : it.cost}</small></button>`;
    }).join('') + `<div class="hint">${cat.hint}</div>`;
    p.querySelectorAll('.card').forEach(el => el.addEventListener('click', () => {
      const it = items[+el.dataset.k];
      if (!S.unlocked(it.unlock)) { UI.toast('Unlocks at ' + C.MILESTONES[it.unlock].name + ' (' + C.MILESTONES[it.unlock].pop.toLocaleString() + ' residents)', 'bad'); return; }
      const t = CB.Tools.tool;
      const same = JSON.stringify(t) === JSON.stringify(it.tool);
      CB.Tools.setTool(same ? null : it.tool);
    }));
    markPalette();
  }
  function markPalette() {
    const items = UI.cat ? catItems(UI.cat) : [];
    const t = JSON.stringify(CB.Tools.tool);
    document.querySelectorAll('#palette .card').forEach(el => el.classList.toggle('on', JSON.stringify(items[+el.dataset.k].tool) === t));
  }
  UI.onToolChange = function () {
    markPalette();
    $('bdz').classList.toggle('on', CB.Tools.tool.type === 'bulldoze');
    if (CB.Tools.tool.type === 'bulldoze' && UI.cat) { UI.cat = null; $('palette').hidden = true; document.querySelectorAll('#toolbar [data-cat]').forEach(b => b.classList.remove('on')); }
  };

  UI.setSpeed = function (s) {
    if (s > 0) UI.lastSpeed = s;
    CB.Sim.speed = s;
    for (const k of [0, 1, 2, 4]) $('sp' + k).classList.toggle('on', k === s);
  };

  // ---------------- toasts / sfx ----------------
  UI.toast = function (text, kind) {
    const el = document.createElement('div');
    el.className = 'glass toast ' + (kind || '');

    try {
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      const f = { build: 520, zone: 660, demolish: 180, click: 880 }[kind] || 600;
      o.type = kind === 'demolish' ? 'sawtooth' : 'triangle';
      o.frequency.setValueAtTime(f, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f * (kind === 'demolish' ? 0.5 : 1.5), actx.currentTime + 0.09);
      g.gain.setValueAtTime(0.045, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.14);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.15);
    } catch (e) { /* audio unavailable */ }
  };

  function spark(cv, vals, col) {
    if (!cv) return;
    const g = cv.getContext('2d'), w = cv.width, h = cv.height;
    g.clearRect(0, 0, w, h);
    if (vals.length < 2) { g.fillStyle = '#93a4b4'; g.font = '22px Barlow, sans-serif'; g.fillText('Shown after the first month', 8, h / 2 + 6); return; }
    const mx = Math.max(...vals), mn = Math.min(0, ...vals), rg = mx - mn || 1;
    g.strokeStyle = 'rgba(160,190,215,0.15)'; g.lineWidth = 1;
    for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(0, h * k / 4); g.lineTo(w, h * k / 4); g.stroke(); }
    g.beginPath();
    vals.forEach((v, k) => { const x = k / (vals.length - 1) * (w - 8) + 4, y = h - 6 - (v - mn) / rg * (h - 14); k ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.strokeStyle = col; g.lineWidth = 3; g.stroke();
    g.lineTo(w - 4, h); g.lineTo(4, h); g.closePath(); g.fillStyle = col + '30'; g.fill();
    const lv = vals[vals.length - 1], ly = h - 6 - (lv - mn) / rg * (h - 14);
    g.fillStyle = col; g.beginPath(); g.arc(w - 4, ly, 5, 0, 7); g.fill();
  }
  function updStats(p) {
    const S = CB.Sim, st = S.stats, Tr = CB.Traffic;
    sv(p, 'jobs', U.num(st.filled + st.outsideIn) + ' / ' + U.num(st.jobs));
    sv(p, 'unemp', (st.unemp * 100).toFixed(1) + '%');
    sv(p, 'cin', U.num(st.outsideIn));
    sv(p, 'edu', Math.round(st.edu * 100) + '%');
    sv(p, 'comm', st.commute ? Math.round(st.commute) + ' min' : '–');
    sv(p, 'flow', Math.round(Tr.stats.flow * 100) + '%');
    sv(p, 'veh', U.num(Tr.stats.active));
    sv(p, 'stuck', U.num(Tr.stats.stuck));
    sv(p, 'bcount', U.num(st.buildingCount));
    const hist = S.history.concat([{ pop: st.pop, money: S.money }]);
    spark(p.querySelector('#spPop'), hist.map(h => h.pop), '#5fcf5a');
    spark(p.querySelector('#spMoney'), hist.map(h => h.money), '#ffb547');
  }
